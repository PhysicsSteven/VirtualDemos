name: E&M laboratory regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
  pull_request:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent numerical references
        run: |
          for demo in transient_circuits rc_circuits gauss_law faraday capacitors ac_circuits circuit_builder coulomb_sandbox diffraction_grating modern_benches circuits photoelectric_record acoustic_labs franck_hertz dna lagrange_points; do
            node "curriculum/validation/test_${demo}.cjs" || exit 1
          done
