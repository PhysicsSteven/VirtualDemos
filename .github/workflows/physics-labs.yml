name: E&M laboratory regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
  pull_request:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent numerical references
        run: |
          for demo in transient_circuits rc_circuits gauss_law faraday capacitors ac_circuits circuit_builder coulomb_sandbox diffraction_grating modern_benches circuits photoelectric_record; do
            node "curriculum/validation/test_${demo}.cjs" || exit 1
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Desktop and phone laboratory workflows
        run: node curriculum/validation/test_browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          EVIDENCE_DIR: browser-evidence
      - name: Current-main laboratory control alignment
        run: node curriculum/validation/test_main_lab_controls.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          DEMO_REF: 7e350d33ccde3ae98edcee026361d19caccd69b7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratory-${{ matrix.browser }}
          path: browser-evidence
          if-no-files-found: ignore
