name: Physics regression (all node suites)
on:
  workflow_dispatch:
  push:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
  pull_request:
    paths:
      - 'demos/**'
      - 'curriculum/validation/**'
      - '.github/workflows/physics-labs.yml'
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent numerical references (every node suite)
        run: |
          set -e
          for f in curriculum/validation/test_*.cjs; do
            if grep -q "playwright\|chromium" "$f"; then echo "skip (browser): $f"; continue; fi
            echo "== $f"; node "$f"
          done
