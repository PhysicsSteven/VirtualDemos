name: House rules (tools/rules.cjs)
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: House rules
        run: node tools/rules.cjs
