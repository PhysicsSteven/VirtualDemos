# Local GitHub Pages build for cloud sessions (tools/cloud/setup.sh --site). Mirrors what Pages does with the repo.
theme: jekyll-theme-primer
baseurl: /VirtualDemos
repository: PhysicsSteven/VirtualDemos
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-github-metadata
exclude: [node_modules, _build, tools]
