<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Crystallization Defense Visuals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one setup bar across the top, the chosen visual below it in a frame that grows to its content. */
:root{--bg:#f6f7f9;--panel:#ffffff;--ink:#14181f;--muted:#556070;--rule:#d5dae2;--accent:#1f5fc4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1318;--panel:#161b22;--ink:#eef2f7;--muted:#9aa6b6;--rule:#2c3440;--accent:#5b97f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--panel:#161b22;--ink:#eef2f7;--muted:#9aa6b6;--rule:#2c3440;--accent:#5b97f0;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;margin:0}
.bar{max-width:1320px;margin:0 auto;padding-block:14px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0 8px 0 0}
.bar .lab{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
iframe{display:block;width:100%;border:0;min-height:600px}
</style>
</head>
<body>
<div class="bar"><h1>Crystallization defense visuals</h1><span class="lab">Setups</span><div class="chips" role="group" aria-label="Setups"><button type="button" class="chip" data-k="front" aria-pressed="false">1. Freezing front</button><button type="button" class="chip" data-k="cliff" aria-pressed="false">2. Melting cliff</button><button type="button" class="chip" data-k="gap" aria-pressed="false">3. Tiny difference</button><button type="button" class="chip" data-k="runs" aria-pressed="false">4. Three runs</button><button type="button" class="chip" data-k="gamma" aria-pressed="false">5. Γ along the star</button><button type="button" class="chip" data-k="opener" aria-pressed="false">6. Title opener</button></div></div>
<div id="host"></div>
<script>
(() => {
const DOCS = {"front": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Freezing Front and Liquid Layer<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: one 16:9 \"stage\" (star cross section | zoomed front | notes) sized for a slide, controls below it. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2;\n  --oxy:#1f5fc4; --carb:#e27a14; --front:#14181f; --mesa:#7a3fb0; --bad:#c8282d; --env:#c9cfd8;\n  --solid-bg:#e9edf3; --liquid-bg:#fbfcfe;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --front:#eef2f7; --mesa:#b07ae0; --bad:#ff6b6b; --env:#3a4350;\n  --solid-bg:#1d2530; --liquid-bg:#121820; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --front:#eef2f7; --mesa:#b07ae0; --bad:#ff6b6b; --env:#3a4350;\n  --solid-bg:#1d2530; --liquid-bg:#121820; color-scheme:dark}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:18px 22px 14px;\n  display:grid;grid-template-rows:auto 1fr auto;gap:10px;aspect-ratio:16/9;min-height:0}\nheader.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\nh1{font-size:clamp(20px,2.2vw,30px);margin:0;text-wrap:balance;font-weight:700}\n.tag{font-size:13px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--muted);color:var(--muted);padding:1px 8px;border-radius:3px}\n.age{margin-left:auto;font-family:var(--f-mono);font-size:clamp(16px,1.7vw,24px);font-variant-numeric:tabular-nums;white-space:nowrap}\n.age small{font-family:var(--f-body);font-size:.6em;color:var(--muted);margin-right:6px}\n.body{display:grid;grid-template-columns:1.05fr 1fr .78fr;gap:18px;min-height:0}\n.panel{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:4px}\n.panel h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}\ncanvas{display:block;width:100%;flex:1;min-height:0}\n#notes{font-size:clamp(13px,1.08vw,15.5px);display:flex;flex-direction:column;gap:9px;overflow:hidden}\n#notes p{margin:0}\n#notes b{font-weight:700}\n.n-o{color:var(--oxy);font-weight:700} .n-c{color:var(--carb);font-weight:700} .n-m{color:var(--mesa);font-weight:700}\n.energy{border-left:4px solid var(--ink);padding:6px 10px;background:var(--bg);border-radius:0 4px 4px 0}\nfooter.key{display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}\n.grad{display:inline-flex;align-items:center;gap:8px}\n.grad i{display:inline-block;width:140px;height:12px;border-radius:2px;background:linear-gradient(90deg,var(--oxy),#8d8b8a,var(--carb))}\n.sw{display:inline-flex;align-items:center;gap:6px}\n.sw i{display:inline-block;width:16px;height:12px;border:1px solid var(--muted);border-radius:2px}\n.src{margin-left:auto;font-size:12px}\n#mesaPanel{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}\n#mesaPanel canvas{flex:1;min-height:150px}\n.steps{display:flex;gap:6px;flex-wrap:wrap}\n.steps button{font:inherit;font-size:13px;padding:2px 9px;border:1.5px solid var(--mesa);background:transparent;color:var(--mesa);border-radius:3px;cursor:pointer}\n.steps button[aria-pressed=\"true\"]{background:var(--mesa);color:var(--stage)}\n#stepText{min-height:4.2em}\n/* controls */\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;display:grid;\n  grid-template-columns:auto 1fr 260px;gap:10px 18px;align-items:center}\n.controls .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.controls button,.controls select{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\n.controls button.primary{background:var(--ink);color:var(--stage)}\n.controls label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}\ninput[type=range]{width:100%;accent-color:var(--ink)}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.slider{display:grid;gap:2px}\n.slider .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono)}\n#spark{height:70px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){\n  #stage{aspect-ratio:auto}\n  .body{grid-template-columns:1fr}\n  #star{height:min(90vw,440px)} #inset{height:460px}\n  .controls{grid-template-columns:1fr}\n  .src{margin-left:0}\n}\n@media (prefers-reduced-motion: reduce){ .controls button{transition:none} }\n[hidden]{display:none!important}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"Crystallization in a cooling white dwarf\">\n  <header class=\"top\">\n    <h1>A white dwarf freezes from the inside out<\/h1>\n    <span class=\"tag\">Schematic<\/span>\n    <span class=\"age\"><small>age<\/small><span id=\"ageTxt\">5.0 Gyr<\/span> &nbsp;<small>crystallized<\/small><span id=\"massTxt\">0.40 M\u2609<\/span><\/span>\n  <\/header>\n  <div class=\"body\">\n    <div class=\"panel\"><h2>Cross section, 0.6113 M\u2609 model<\/h2><canvas id=\"star\" role=\"img\" aria-label=\"Cross section of the white dwarf with a crystallized core growing outward\"><\/canvas><\/div>\n    <div class=\"panel\"><h2 id=\"insetTitle\">Zoom on the freezing front<\/h2><canvas id=\"inset\" role=\"img\" aria-label=\"Zoomed view: solid mixed crystal below, liquid above, carbon rich liquid rising\"><\/canvas><\/div>\n    <div class=\"panel\" id=\"notesPanel\">\n      <div id=\"notes\">\n        <p><b>Both ions freeze together<\/b> into one mixed C/O bcc crystal. The solid is <span class=\"n-o\">slightly oxygen rich<\/span> compared with the liquid it freezes from (Blouin and Daligault 2021).<\/p>\n        <p>The liquid left just above the front is <span class=\"n-c\">carbon rich<\/span>, so it is lighter. It rises by buoyancy and mixes outward until the liquid is stably layered.<\/p>\n        <p><b>Nothing moves in the solid.<\/b> Each shell keeps the composition it froze with, so the core holds rings: oxygen rich at the center, less oxygen rich outward.<\/p>\n        <p class=\"energy\"><b>Why cooling slows:<\/b> freezing releases latent heat, and oxygen concentrating toward the center (carbon moving out) releases gravitational energy. Both delay the cooling.<\/p>\n        <p style=\"font-size:.9em;color:var(--muted)\">End of run, center: X<sub>O<\/sub> \u2248 0.785, X<sub>C<\/sub> \u2248 0.188 with phase separation; X<sub>O<\/sub> \u2248 0.672, X<sub>C<\/sub> \u2248 0.301 without (Ch 8).<\/p>\n      <\/div>\n      <div id=\"mesaPanel\" hidden>\n        <p style=\"margin:0;font-size:14px\"><span class=\"n-m\">Inside MESA<\/span> (numerical, not in the real star). One liquid zone just above the front:<\/p>\n        <div class=\"steps\" id=\"steps\"><\/div>\n        <p id=\"stepText\" style=\"margin:0;font-size:clamp(13px,1.05vw,15px)\"><\/p>\n        <canvas id=\"gauge\" role=\"img\" aria-label=\"Gauge of one zone's temperature against the blur window, and the latent heat fed to it\"><\/canvas>\n      <\/div>\n    <\/div>\n  <\/div>\n  <footer class=\"key\">\n    <span class=\"grad\">oxygen rich <i><\/i> carbon rich<\/span>\n    <span class=\"sw\"><i style=\"background:var(--solid-bg)\"><\/i>solid: ions on a lattice<\/span>\n    <span class=\"sw\"><i style=\"background:var(--liquid-bg)\"><\/i>liquid: ions disordered, moving<\/span>\n    <span class=\"src\">Growth curve, radii and colors schematic between Fig 7-4 endpoints (1.9 to 8.5 Gyr, 0 to 0.58 M\u2609). Front \u0393: Table 9-1.<\/span>\n  <\/footer>\n<\/section>\n\n<div class=\"controls\">\n  <div class=\"row\">\n    <button id=\"play\" class=\"primary\" type=\"button\">Play<\/button>\n    <button id=\"reset\" type=\"button\">Reset<\/button>\n    <label><input id=\"mesa\" type=\"checkbox\"> Inside MESA<\/label>\n    <label><input id=\"motion\" type=\"checkbox\" checked> Liquid motion<\/label>\n    <button id=\"theme\" type=\"button\" title=\"Switch between light and dark\">Dark<\/button>\n  <\/div>\n  <div class=\"slider\">\n    <label for=\"age\" style=\"font-size:13px;color:var(--muted)\">Age of the white dwarf (Gyr)<\/label>\n    <input id=\"age\" type=\"range\" min=\"1.9\" max=\"8.5\" step=\"0.01\" value=\"5\">\n    <div class=\"ticks\"><span>1.9<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>8.5<\/span><\/div>\n  <\/div>\n  <canvas id=\"spark\" role=\"img\" aria-label=\"Crystallized mass versus age, schematic\"><\/canvas>\n<\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 1. Plume motion in the zoom is not to time scale: the front moves over billions of years while convective mixing is fast by comparison. The bands in the core show composition, not a physical boundary.<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst T0 = 1.9, T1 = 8.5, MC_END = 0.58, MSTAR = 0.6113, QMAX = MC_END / MSTAR;\nconst params = new URLSearchParams(location.search);\nconst STILL = params.has('still');\nif (STILL) document.body.classList.add('still');\n\n// ---------- schematic model ----------\nconst g = u => 1 - Math.pow(1 - u, 1.8);                 // schematic growth shape between the two Fig 7-4 endpoints\nconst qFront = t => QMAX * g(Math.min(1, Math.max(0, (t - T0) / (T1 - T0))));\nconst XL = q => 0.672 - 0.12 * Math.pow(q / QMAX, 1.2);   // liquid oxygen fraction drifts down (schematic)\nconst XS = q => { const x = XL(q); return x + 0.113 * (x - 0.45) / 0.222; }; // solid slightly oxygen rich; center 0.785\n\n// mass fraction -> radius for a schematic centrally concentrated profile rho ~ (1 - r^2)^1.5\nconst RT = (() => { const n = 400, m = [0]; let s = 0;\n  for (let i = 1; i <= n; i++) { const r = (i - .5) / n; s += Math.pow(1 - r * r, 1.5) * r * r; m.push(s); }\n  return m.map(v => v / s); })();\nconst rOfQ = q => { if (q <= 0) return 0; if (q >= 1) return 1; let i = 1; while (RT[i] < q) i++;\n  const f = (q - RT[i - 1]) / (RT[i] - RT[i - 1]); return (i - 1 + f) / 400; };\n\n// ---------- colors ----------\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nlet C = {};\nconst hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };\nfunction readColors() { ['--oxy','--carb','--ink','--muted','--rule','--front','--mesa','--bad','--env','--solid-bg','--liquid-bg','--stage','--bg']\n  .forEach(k => C[k.slice(2)] = css(k)); C.O = hex(C.oxy); C.Cc = hex(C.carb); C.dark = document.documentElement.dataset.theme === 'dark' ||\n  (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); }\nconst X_LO = 0.52, X_HI = 0.80;\nfunction mix(x, lighten) { // x = oxygen fraction -> rgb; lighten 0..1 toward page background\n  const t = Math.min(1, Math.max(0, (x - X_LO) / (X_HI - X_LO)));\n  let c = C.Cc.map((v, i) => v + (C.O[i] - v) * t);\n  const mid = 1 - Math.abs(t - .5) * 2; c = c.map(v => v * (1 - .18 * mid) + 128 * .18 * mid);\n  const b = hex(C.stage); c = c.map((v, i) => v + (b[i] - v) * lighten);\n  return `rgb(${c.map(Math.round).join(',')})`; }\nconst solidCol = x => mix(x, C.dark ? .15 : .05);\nconst liquidCol = x => mix(x, C.dark ? .62 : .72);\n\n// ---------- state ----------\nlet t = +(params.get('t') || 5), playing = false, mesa = params.has('mesa'), motion = true, last = performance.now(), clock = 0;\nlet mesaStepHold = params.has('step') ? +params.get('step') : null;\nconst ageEl = document.getElementById('age'); ageEl.value = t;\ndocument.getElementById('mesa').checked = mesa;\n\n// seeded random\nfunction rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);\n  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }\nconst hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };\n\n// ---------- canvas helpers ----------\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction label(x, s, px, py, o = {}) { x.save(); x.font = `${o.bold ? 700 : 400} ${o.size || 14}px ${o.mono ? 'IBM Plex Mono' : 'Atkinson Hyperlegible'}, sans-serif`;\n  x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'middle';\n  if (o.halo !== false) { x.lineWidth = 4; x.strokeStyle = o.haloCol || C.stage; x.lineJoin = 'round'; x.strokeText(s, px, py); }\n  x.fillStyle = o.col || C.ink; x.fillText(s, px, py); x.restore(); }\n\n// ---------- star cross section ----------\nconst RING = QMAX / 10;\nfunction drawStar() {\n  const [x, w, h] = fit(document.getElementById('star'));\n  x.clearRect(0, 0, w, h);\n  const R = Math.min(w, h) / 2 - 26, cx = w / 2, cy = h / 2 + 6, Rc = R * 0.955;\n  const qF = qFront(t), xl = XL(qF);\n  // envelope (thin He and H layers, exaggerated)\n  x.fillStyle = C.env; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();\n  x.fillStyle = mix(.5, C.dark ? .5 : .55); x.beginPath(); x.arc(cx, cy, R * .978, 0, 7); x.fill();\n  // liquid C/O core\n  x.fillStyle = liquidCol(xl); x.beginPath(); x.arc(cx, cy, Rc, 0, 7); x.fill();\n  // solid: draw shells from front inward, each with the color it froze with\n  const rF = rOfQ(qF) * Rc;\n  if (qF > 0) {\n    const n = 160;\n    for (let i = n; i >= 1; i--) { const q = qF * i / n; x.fillStyle = solidCol(XS(q)); x.beginPath(); x.arc(cx, cy, rOfQ(q) * Rc, 0, 7); x.fill(); }\n    // lattice texture\n    x.save(); x.beginPath(); x.arc(cx, cy, rF, 0, 7); x.clip(); x.fillStyle = C.dark ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.35)';\n    for (let yy = cy - rF; yy < cy + rF; yy += 7) for (let xx = cx - rF + ((Math.round((yy - cy) / 7) & 1) ? 3.5 : 0); xx < cx + rF; xx += 7) x.fillRect(xx, yy, 1.4, 1.4);\n    // ring lines (tree rings)\n    x.strokeStyle = C.dark ? 'rgba(0,0,0,.45)' : 'rgba(20,24,31,.22)'; x.lineWidth = 1;\n    for (let q = RING; q < qF; q += RING) { x.beginPath(); x.arc(cx, cy, rOfQ(q) * Rc, 0, 7); x.stroke(); }\n    x.restore();\n    // front\n    x.lineWidth = 3; x.strokeStyle = C.front; x.beginPath(); x.arc(cx, cy, rF, 0, 7); x.stroke();\n  }\n  // inset marker on the front at upper right\n  const a = -Math.PI / 4, bx = cx + Math.cos(a) * Math.max(rF, 10), by = cy + Math.sin(a) * Math.max(rF, 10);\n  x.strokeStyle = C.ink; x.lineWidth = 1.5; x.setLineDash([4, 3]); x.strokeRect(bx - 13, by - 13, 26, 26); x.setLineDash([]);\n  label(x, 'zoom \u2192', bx + 17, by - 18, { size: 13, col: C.muted });\n  // labels\n  const ls = Math.max(12, Math.min(16, w / 34));\n  if (qF > 0.02) {\n    label(x, 'solid core', cx, cy - Math.min(rF * .35, 30), { align: 'center', bold: true, size: ls + 1 });\n    label(x, 'mixed C/O crystal', cx, cy - Math.min(rF * .35, 30) + ls + 3, { align: 'center', size: ls - 1 });\n  }\n  const ly = cy + (rF + Rc) / 2 * 0.98;\n  if (Rc - rF > 40) label(x, 'liquid C/O', cx, Math.min(ly, cy + Rc - 12), { align: 'center', bold: true, size: ls });\n  label(x, 'freezing front', cx - rF * .72 - 6, cy + rF * .72 + 4, { align: 'right', size: ls - 1, bold: true });\n  label(x, 'He and H layers (thickness exaggerated)', cx, cy - R - 12, { align: 'center', size: 12, col: C.muted });\n}\n\n// ---------- inset: zoom on the front, frame follows the front ----------\nconst A = 22;            // lattice spacing (px)\nconst NROWS = 64, DQ = QMAX / NROWS; // rows of solid over the whole run\nconst liquid = []; const plumes = []; let plumeSeed = rng(7), spawnAcc = 0;\nfunction initLiquid(w, h) { const r = rng(11); liquid.length = 0;\n  for (let i = 0; i < 260; i++) liquid.push({ x: r() * w, y: r() * h, s: r(), vx: 0, vy: 0 }); }\nlet insetW = 0, insetH = 0;\nfunction stepInset(dt, w, h, yF) {\n  if (!liquid.length || Math.abs(insetW - w) > 1 || Math.abs(insetH - h) > 1) { initLiquid(w, h); insetW = w; insetH = h; }\n  const r = plumeSeed;\n  for (const p of liquid) { p.vx += (r() - .5) * 220 * dt; p.vy += (r() - .5) * 220 * dt; p.vx *= .9; p.vy *= .9;\n    p.x += p.vx * dt; p.y += p.vy * dt; if (p.x < 0) p.x += w; if (p.x > w) p.x -= w; if (p.y < 4) { p.y = 4; p.vy = Math.abs(p.vy); } }\n  // plumes: carbon rich liquid released at the front rises by buoyancy and mixes in\n  if (t < T1 - 1e-6 || true) { spawnAcc += dt * 1.6; while (spawnAcc > 1) { spawnAcc--; plumes.push({ x: 20 + r() * (w - 40), y: yF - 6, r: 7 + r() * 4, age: 0, life: 3.5 + r() * 1.5, dx: (r() - .5) * 14 }); } }\n  for (const p of plumes) { p.age += dt; const k = p.age / p.life; p.y -= (18 + 70 * Math.sin(Math.PI * Math.min(1, k)) ) * dt; p.x += p.dx * dt; p.r = 7 + 34 * k; }\n  for (let i = plumes.length - 1; i >= 0; i--) if (plumes[i].age > plumes[i].life) plumes.splice(i, 1);\n}\nfunction drawInset(dt) {\n  const cv = document.getElementById('inset'); const [x, w, h] = fit(cv);\n  const yF = h * 0.6, qF = qFront(t), xl = XL(qF);\n  if (motion) stepInset(dt, w, h, yF);\n  x.clearRect(0, 0, w, h);\n  // liquid background, carbon rich layer right above the front\n  x.fillStyle = liquidCol(xl); x.fillRect(0, 0, w, yF);\n  const gr = x.createLinearGradient(0, yF - 26, 0, yF); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(${C.Cc.join(',')},.28)`);\n  x.fillStyle = gr; x.fillRect(0, yF - 26, w, 26);\n  // plumes\n  for (const p of plumes) { const k = p.age / p.life, al = .7 * (1 - k * .85) * Math.min(1, p.age * 4);\n    const rg = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); rg.addColorStop(0, `rgba(${C.Cc.join(',')},${al})`); rg.addColorStop(1, `rgba(${C.Cc.join(',')},0)`);\n    x.fillStyle = rg; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }\n  // liquid ions (disordered)\n  for (const p of liquid) { if (p.y > yF - 5) continue; const isO = p.s < xl;\n    x.fillStyle = isO ? C.oxy : C.carb; x.globalAlpha = .8; x.beginPath(); x.arc(p.x, p.y, isO ? 4.2 : 3.6, 0, 7); x.fill(); }\n  x.globalAlpha = 1;\n  // solid region\n  x.fillStyle = C['solid-bg']; x.fillRect(0, yF, w, h - yF);\n  const kTop = Math.floor(qF / DQ);\n  for (let k = kTop; k >= 0; k--) {\n    const y = yF + (qF - k * DQ) / DQ * A * 0.5 + A * .25; if (y > h + A) break;\n    const xs = XS(k * DQ); x.fillStyle = solidCol(xs); x.globalAlpha = .28; x.fillRect(0, y - A * .25, w, A * .5); x.globalAlpha = 1;\n    const off = (k & 1) ? A / 2 : 0;\n    for (let j = -1; j * A < w + A; j++) { const isO = hash(k, j) < xs; const px = j * A + off + 6;\n      x.fillStyle = isO ? C.oxy : C.carb; x.beginPath(); x.arc(px, y, isO ? 5 : 4.3, 0, 7); x.fill();\n      x.strokeStyle = C.dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.8)'; x.lineWidth = 1; x.stroke(); }\n    if (k % Math.round(RING / DQ) === 0 && k > 0) { x.strokeStyle = C.dark ? 'rgba(255,255,255,.25)' : 'rgba(20,24,31,.25)'; x.setLineDash([2, 4]);\n      x.beginPath(); x.moveTo(0, y + A * .25); x.lineTo(w, y + A * .25); x.stroke(); x.setLineDash([]); }\n  }\n  if (qF <= 0) { x.fillStyle = C.stage; x.fillRect(0, yF, w, h - yF); label(x, 'no solid yet: freezing starts at the center at about 1.9 Gyr', w / 2, yF + 40, { align: 'center', col: C.muted }); }\n  // front line\n  x.strokeStyle = C.front; x.lineWidth = 3; x.beginPath(); x.moveTo(0, yF); x.lineTo(w, yF); x.stroke();\n  if (mesa) drawMesaOverlay(x, w, h, yF, qF);\n  // labels\n  const s = Math.max(12, Math.min(16, w / 30));\n  label(x, 'LIQUID', 12, 18, { bold: true, size: s + 1 });\n  label(x, 'ions disordered, free to move', 12, 18 + s + 4, { size: s - 1, col: C.muted });\n  if (!mesa) {\n    label(x, 'carbon rich liquid is lighter:', w - 12, yF - 90, { align: 'right', size: s - 1, col: C.carb, bold: true });\n    label(x, 'it rises and mixes outward \u2191', w - 12, yF - 90 + s + 3, { align: 'right', size: s - 1, col: C.carb, bold: true });\n  }\n  label(x, 'freezing front   \u0393 \u2248 205 to 219', 12, yF - 12, { bold: true, size: s });\n  if (qF > 0) {\n    label(x, 'SOLID: mixed C/O bcc crystal', 12, yF + 30, { bold: true, size: s + 1 });\n    label(x, 'slightly oxygen rich vs the liquid above', 12, yF + 30 + s + 4, { size: s - 1 });\n    label(x, 'older layers below keep the composition they froze with', 12, h - 14, { size: s - 1, col: C.muted });\n    label(x, 'center \u2193', w - 12, h - 14, { align: 'right', size: s - 1, col: C.muted });\n  }\n  label(x, 'outward \u2191', w - 12, 18, { align: 'right', size: s - 1, col: C.muted });\n}\n\n// ---------- inside MESA overlay and cycle ----------\nconst STEPS = [\n  ['Cools into the window', 'This liquid zone cools into the blur window. MESA starts feeding its latent heat in smoothly (half before the melting point, half after).'],\n  ['Carbon arrives', 'Phase separation in the zone below (phase above 0.9) hands its displaced carbon up to this zone.'],\n  ['Melting point drops', 'More carbon lowers the zone\u2019s melting point. At the same temperature, the window slides away to colder: the zone is back on the liquid side. The heat already fed is not taken back.'],\n  ['Fed a second time', 'The zone cools through the window again and is fed the same part again. That part of the latent heat is paid twice: energy created at the transition.'],\n];\nconst CYCLE = [3.2, 2.4, 3.0, 4.4]; const CYC_T = CYCLE.reduce((a, b) => a + b);\nfunction cycleState() { // returns [step index, fraction within step]\n  if (mesaStepHold != null) return [mesaStepHold, 1];\n  let c = clock % CYC_T; for (let i = 0; i < 4; i++) { if (c < CYCLE[i]) return [i, c / CYCLE[i]]; c -= CYCLE[i]; } return [3, 1]; }\nfunction drawMesaOverlay(x, w, h, yF, qF) {\n  const zh = A * 1.6, win = zh * 1.5;   // zone height; window half width (schematic)\n  // zone boundaries\n  x.strokeStyle = C.mesa; x.globalAlpha = .55; x.lineWidth = 1; x.setLineDash([6, 5]);\n  for (let y = yF - zh * 4; y < h; y += zh) { x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }\n  x.setLineDash([]); x.globalAlpha = 1;\n  // blur window\n  x.save(); x.fillStyle = C.mesa; x.globalAlpha = .13; x.fillRect(0, yF - win, w, 2 * win); x.restore();\n  x.save(); x.beginPath(); x.rect(0, yF - win, w, 2 * win); x.clip(); x.strokeStyle = C.mesa; x.globalAlpha = .22; x.lineWidth = 1;\n  for (let i = -h; i < w; i += 10) { x.beginPath(); x.moveTo(i, yF + win); x.lineTo(i + 2 * win, yF - win); x.stroke(); } x.restore();\n  x.strokeStyle = C.mesa; x.lineWidth = 2; [yF - win, yF + win].forEach(y => { x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); });\n  // highlighted zone, in the upper half of the window\n  const [st, f] = cycleState(); const zTop = yF - zh * 1.25, zx = w * .52, zw = w * .3;\n  const carb = st === 0 ? 0 : st === 1 ? f : 1;\n  x.fillStyle = `rgba(${C.Cc.join(',')},${.12 + .35 * carb})`; x.fillRect(zx, zTop, zw, zh);\n  x.strokeStyle = C.mesa; x.lineWidth = 3; x.strokeRect(zx, zTop, zw, zh);\n  label(x, 'zone Z', zx + zw / 2, zTop + zh / 2, { align: 'center', bold: true, col: C.mesa });\n  if (st === 1) { const py = yF + 8 - (yF + 8 - (zTop + zh / 2)) * f; x.fillStyle = `rgba(${C.Cc.join(',')},.85)`;\n    x.beginPath(); x.arc(zx + zw / 2, py, 7, 0, 7); x.fill(); }\n  const s = Math.max(12, Math.min(15, w / 32));\n  label(x, 'MESA blur window', w - 10, yF - win - 26, { align: 'right', bold: true, col: C.mesa, size: s });\n  label(x, 'numerical device, not in the real star', w - 10, yF - win - 10, { align: 'right', col: C.mesa, size: s - 1 });\n  label(x, 'dashed lines: MESA zones', w - 10, yF + win + 14, { align: 'right', col: C.mesa, size: s - 1 });\n}\nfunction drawGauge() {\n  const cv = document.getElementById('gauge'); if (cv.offsetParent === null) return; const [x, w, h] = fit(cv);\n  x.clearRect(0, 0, w, h);\n  const [st, f] = cycleState();\n  const L = 14, Rr = w - 14, ax = v => L + (Rr - L) * v; // v: 0 hot .. 1 cold\n  const yA = 46;\n  // window position: center 0.55, shifts to 0.8 after carbon arrives\n  const shift = st < 2 ? 0 : st === 2 ? Math.min(1, f * 1.6) : 1, wc = .5 + .28 * shift, hw = .14;\n  // zone temperature marker\n  let zt; if (st === 0) zt = .2 + (.5 - .2) * f; else if (st < 3) zt = .5; else zt = .5 + (.84 - .5) * f;\n  label(x, 'hotter: liquid side', L, 8, { size: 12, col: C.muted }); label(x, 'colder: solid side \u2192', Rr, 8, { size: 12, col: C.muted, align: 'right' });\n  x.strokeStyle = C.ink; x.lineWidth = 2; x.beginPath(); x.moveTo(L, yA); x.lineTo(Rr, yA); x.stroke();\n  x.fillStyle = C.mesa; x.globalAlpha = .22; x.fillRect(ax(wc - hw), yA - 12, ax(wc + hw) - ax(wc - hw), 24); x.globalAlpha = 1;\n  x.strokeStyle = C.mesa; x.lineWidth = 2; x.strokeRect(ax(wc - hw), yA - 12, ax(wc + hw) - ax(wc - hw), 24);\n  x.beginPath(); x.moveTo(ax(wc), yA - 14); x.lineTo(ax(wc), yA + 14); x.stroke();\n  label(x, 'melting point', ax(wc), yA + 24, { align: 'center', size: 12, col: C.mesa });\n  x.fillStyle = st >= 1 ? C.carb : C.ink; x.beginPath(); x.moveTo(ax(zt), yA - 4); x.lineTo(ax(zt) - 7, yA - 18); x.lineTo(ax(zt) + 7, yA - 18); x.fill();\n  label(x, 'zone Z', ax(zt), yA - 26, { align: 'center', size: 12, bold: true });\n  // fed vs dropped bar\n  const yB = yA + 56, bh = 22, full = (Rr - L) / 1.5;\n  const fed1 = st === 0 ? .3 * f : .3;                       // part fed on the first pass (fraction of one latent heat)\n  const fed2 = st < 3 ? 0 : Math.max(0, Math.min(1, (zt - (wc - hw)) / (2 * hw)));\n  label(x, 'latent heat fed to zone Z', L, yB - 10, { size: 12, col: C.muted });\n  x.fillStyle = C.ink; x.globalAlpha = .75; x.fillRect(L, yB, full * fed1, bh); x.globalAlpha = 1;\n  const over = Math.min(fed2, fed1), rest = fed2 - over;\n  x.fillStyle = C.bad; x.fillRect(L + full * fed1, yB, full * over, bh);\n  x.fillStyle = C.ink; x.globalAlpha = .45; x.fillRect(L + full * (fed1 + over), yB, full * rest, bh); x.globalAlpha = 1;\n  x.strokeStyle = C.ink; x.lineWidth = 2; x.beginPath(); x.moveTo(L + full, yB - 6); x.lineTo(L + full, yB + bh + 6); x.stroke();\n  label(x, 'one latent heat', L + full + 6, yB + bh / 2, { size: 12 });\n  if (over > 0.01) label(x, 'paid twice', L + full * (fed1 + over / 2), yB + bh + 14, { align: 'center', size: 13, bold: true, col: C.bad });\n  if (st === 2) label(x, 'not taken back', L + full * fed1 / 2, yB + bh + 14, { align: 'center', size: 13, bold: true });\n  label(x, 'schematic sizes', Rr, h - 8, { align: 'right', size: 11, col: C.muted });\n}\nconst stepsEl = document.getElementById('steps'), stepText = document.getElementById('stepText');\nSTEPS.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = (i + 1) + '. ' + s[0];\n  b.addEventListener('click', () => { mesaStepHold = mesaStepHold === i ? null : i; }); stepsEl.appendChild(b); });\nconst autoBtn = document.createElement('button'); autoBtn.type = 'button'; autoBtn.textContent = 'Loop';\nautoBtn.addEventListener('click', () => { mesaStepHold = null; }); stepsEl.appendChild(autoBtn);\nlet shownStep = -1;\nfunction updateSteps() { const [st] = cycleState(); if (st !== shownStep || true) {\n  [...stepsEl.children].forEach((b, i) => b.setAttribute('aria-pressed', i < 4 ? String(i === st) : String(mesaStepHold == null)));\n  if (st !== shownStep) { stepText.textContent = STEPS[st][1]; shownStep = st; } } }\n\n// ---------- spark line: crystallized mass vs age ----------\nfunction drawSpark() {\n  const [x, w, h] = fit(document.getElementById('spark')); x.clearRect(0, 0, w, h);\n  const L = 34, R = w - 8, T = 8, B = h - 18; const px = a => L + (R - L) * (a - T0) / (T1 - T0), py = m => B - (B - T) * m / 0.6;\n  x.strokeStyle = C.rule; x.lineWidth = 1; x.beginPath(); x.moveTo(L, T); x.lineTo(L, B); x.lineTo(R, B); x.stroke();\n  x.strokeStyle = C.ink; x.lineWidth = 2; x.beginPath();\n  for (let i = 0; i <= 80; i++) { const a = T0 + (T1 - T0) * i / 80, m = qFront(a) * MSTAR; i ? x.lineTo(px(a), py(m)) : x.moveTo(px(a), py(m)); } x.stroke();\n  const m = qFront(t) * MSTAR; x.fillStyle = C.oxy; x.beginPath(); x.arc(px(t), py(m), 5, 0, 7); x.fill();\n  label(x, '0.58', L - 4, py(.58), { align: 'right', size: 11, mono: true, halo: false, col: C.muted });\n  label(x, '0', L - 4, B, { align: 'right', size: 11, mono: true, halo: false, col: C.muted });\n  label(x, 'M\u2609 crystallized (schematic shape)', L + 6, T + 4, { size: 11, halo: false, col: C.muted });\n  label(x, '1.9', L, B + 10, { align: 'center', size: 11, mono: true, halo: false, col: C.muted });\n  label(x, '8.5 Gyr', R, B + 10, { align: 'right', size: 11, mono: true, halo: false, col: C.muted });\n}\n\n// ---------- wiring ----------\nfunction readouts() { document.getElementById('ageTxt').textContent = t.toFixed(1) + ' Gyr';\n  document.getElementById('massTxt').textContent = '\u2248 ' + (qFront(t) * MSTAR).toFixed(2) + ' M\u2609'; }\nfunction setMesa(on) { mesa = on; document.getElementById('notes').hidden = on; document.getElementById('mesaPanel').hidden = !on;\n  document.getElementById('insetTitle').textContent = on ? 'Zoom on the front, as MESA sees it' : 'Zoom on the freezing front'; }\nconst playBtn = document.getElementById('play');\nplayBtn.onclick = () => { if (t >= T1 - 1e-6) t = T0; playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };\ndocument.getElementById('reset').onclick = () => { t = T0; ageEl.value = t; playing = false; playBtn.textContent = 'Play'; };\nageEl.oninput = () => { t = +ageEl.value; };\ndocument.getElementById('mesa').onchange = e => setMesa(e.target.checked);\ndocument.getElementById('motion').onchange = e => { motion = e.target.checked; };\nconst themeBtn = document.getElementById('theme');\nfunction syncThemeBtn() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; syncThemeBtn(); };\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeBtn);\nnew MutationObserver(syncThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nif (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');\nif (matchMedia('(prefers-reduced-motion: reduce)').matches && !STILL) { motion = false; document.getElementById('motion').checked = false; }\nreadColors(); setMesa(mesa);\n\nfunction frame(now) {\n  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;\n  if (playing) { t = Math.min(T1, t + dt * 0.55); ageEl.value = t; if (t >= T1) { playing = false; playBtn.textContent = 'Play'; } }\n  clock += dt;\n  readouts(); drawStar(); drawInset(dt); if (mesa) { updateSteps(); drawGauge(); } drawSpark();\n  requestAnimationFrame(frame);\n}\nif (STILL) { // settle the liquid and plumes so a still frame looks like the running page\n  readColors(); const cv = document.getElementById('inset');\n  requestAnimationFrame(() => { for (let i = 0; i < 160; i++) { stepInset(1 / 30, cv.clientWidth, cv.clientHeight, cv.clientHeight * .6); clock += 1 / 30; }\n    if (params.has('clock')) clock = +params.get('clock'); last = performance.now(); motion = false; requestAnimationFrame(frame); });\n} else requestAnimationFrame(frame);\n})();\n<\/script>\n<\/body><\/html>", "cliff": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Melting Cliff, One Zone<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: one 16:9 stage (energy plot over running totals | story notes), controls below. Same tokens as Visual 1. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2;\n  --oxy:#1f5fc4; --carb:#e27a14; --mesa:#7a3fb0; --bad:#c8282d; --good:#1d8a5a;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a; color-scheme:dark}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:18px 22px 14px;\n  display:grid;grid-template-rows:auto 1fr auto;gap:10px;aspect-ratio:16/9;min-height:0}\nheader.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\nh1{font-size:clamp(20px,2.2vw,30px);margin:0;text-wrap:balance}\n.tag{font-size:13px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--muted);color:var(--muted);padding:1px 8px;border-radius:3px}\n.mode{margin-left:auto;font-weight:700;font-size:clamp(15px,1.5vw,20px)}\n.body{display:grid;grid-template-columns:1.9fr 1fr;gap:22px;min-height:0}\n.plots{display:grid;grid-template-rows:1.45fr 1fr;gap:8px;min-height:0}\ncanvas{display:block;width:100%;height:100%;min-height:0}\n#notes{display:flex;flex-direction:column;gap:10px;font-size:clamp(13px,1.1vw,16px);min-width:0}\n#notes p{margin:0}\n.stepnum{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}\n#stepHead{font-size:clamp(17px,1.5vw,21px);font-weight:700;margin:0}\n.box{border-left:4px solid var(--mesa);padding:6px 10px;background:var(--bg);border-radius:0 4px 4px 0}\n.box.fix{border-color:var(--good)}\nfooter.key{display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}\n.ln{display:inline-flex;align-items:center;gap:6px}\n.ln i{display:inline-block;width:26px;height:0;border-top:3px solid}\n.src{margin-left:auto;font-size:12px}\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}\n.controls button{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\n.controls button.primary{background:var(--ink);color:var(--stage)}\n.controls button[aria-pressed=\"true\"]{background:var(--mesa);border-color:var(--mesa);color:var(--stage)}\n.seg{display:inline-flex;gap:0}\n.seg button{border-radius:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}\n.seg button+button{border-left:0}\ninput[type=range]{flex:1;min-width:160px;accent-color:var(--ink)}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){#stage{aspect-ratio:auto}.body{grid-template-columns:1fr}.plots{height:560px}.src{margin-left:0}}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"One zone's internal energy and the melting cliff\">\n  <header class=\"top\">\n    <h1>One liquid zone above the front: where the extra energy comes from<\/h1>\n    <span class=\"tag\">Schematic<\/span>\n    <span class=\"mode\" id=\"modeTxt\">MESA<\/span>\n  <\/header>\n  <div class=\"body\">\n    <div class=\"plots\">\n      <canvas id=\"eplot\" role=\"img\" aria-label=\"Internal energy of one zone versus temperature, with the melting cliff and MESA's smoothed version\"><\/canvas>\n      <canvas id=\"tplot\" role=\"img\" aria-label=\"Running totals: latent heat fed by MESA and the energy drop at the cliff\"><\/canvas>\n    <\/div>\n    <div id=\"notes\">\n      <span class=\"stepnum\" id=\"stepNum\">Step 1 of 3<\/span>\n      <p id=\"stepHead\"><\/p>\n      <p id=\"stepText\"><\/p>\n      <p class=\"box\" id=\"boxText\"><\/p>\n    <\/div>\n  <\/div>\n  <footer class=\"key\" id=\"key\"><\/footer>\n<\/section>\n\n<div class=\"controls\">\n  <button id=\"play\" class=\"primary\" type=\"button\">Play<\/button>\n  <div class=\"seg\" role=\"group\" aria-label=\"Code version\">\n    <button id=\"mMesa\" type=\"button\" aria-pressed=\"true\">MESA<\/button>\n    <button id=\"mMod\" type=\"button\" aria-pressed=\"false\">Modified MESA<\/button>\n  <\/div>\n  <div class=\"seg\" role=\"group\" aria-label=\"Step\">\n    <button id=\"s1\" type=\"button\">1. Cools in<\/button><button id=\"s2\" type=\"button\">2. Carbon arrives<\/button><button id=\"s3\" type=\"button\">3. Cools through<\/button>\n  <\/div>\n  <input id=\"prog\" type=\"range\" min=\"0\" max=\"3\" step=\"0.005\" value=\"3\" aria-label=\"Progress through the zone's history\">\n  <button id=\"theme\" type=\"button\">Dark<\/button>\n<\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 2. Every size here is schematic: the window width, where the zone sits when carbon arrives, and how far the melting point moves were chosen to be easy to see. The measured excess is 4.3 \u00d7 10\u2074\u2075 erg in run B and 4.1 \u00d7 10\u2074\u2075 erg in run C, 29% of the latent heat of the crystallized mass (Section 8.3.6).<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst P = new URLSearchParams(location.search), STILL = P.has('still');\nif (STILL) document.body.classList.add('still');\n// ---------- schematic model (cooling coordinate c: 0 hot, 1 cold) ----------\nconst HW = 0.075, CM1 = 0.40, CM2 = 0.62, C0 = 0.06, CEND = 0.80, L = 0.30;\nconst CB = CM1 - 0.3 * HW;                       // where the zone is when carbon arrives (inside the window, hot half)\nconst ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);\nconst S = (c, cm) => ease((c - (cm - HW)) / (2 * HW));   // fraction of latent heat MESA has fed (smooth window)\nconst El = c => 0.92 - 0.42 * c;                // liquid branch (falls as it cools)\nconst Es = c => El(c) - L;                      // solid branch, lower by the latent heat\nfunction state(s) {\n  const c = s < 1 ? C0 + (CB - C0) * ease(s) : s < 2 ? CB : CB + (CEND - CB) * ease(s - 2);\n  const cm = s < 1 ? CM1 : s < 2 ? CM1 + (CM2 - CM1) * ease(s - 1) : CM2;\n  const carbon = s < 1 ? 0 : s < 2 ? ease(s - 1) : 1;\n  const fed1 = S(Math.min(c, CB), CM1);\n  const fed = s <= 1 ? S(c, CM1) : s <= 2 ? fed1 : fed1 + S(c, CM2);\n  const drop = c > cm ? 1 : 0;                  // Skye: sharp switch at the melting point\n  const smooth = S(c, cm);                       // Modified MESA: energy itself is the smooth blend\n  return { c, cm, carbon, fed, drop, smooth };\n}\n// ---------- colors / canvas ----------\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nlet C = {};\nfunction readColors() { ['--ink','--muted','--rule','--mesa','--bad','--good','--carb','--oxy','--stage','--bg'].forEach(k => C[k.slice(2)] = css(k));\n  const th = document.documentElement.dataset.theme; C.dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches); }\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction label(x, s, px, py, o = {}) { x.save(); x.font = `${o.bold ? 700 : 400} ${o.size || 14}px ${o.mono ? 'IBM Plex Mono' : 'Atkinson Hyperlegible'}, sans-serif`;\n  x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'middle';\n  if (o.halo !== false) { x.lineWidth = 4; x.strokeStyle = C.stage; x.lineJoin = 'round'; x.strokeText(s, px, py); }\n  x.fillStyle = o.col || C.ink; x.fillText(s, px, py); x.restore(); }\nfunction line(x, pts, col, w, dash) { x.save(); x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []); x.beginPath();\n  pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); x.restore(); }\nfunction arrowHead(x, x0, y0, x1, y1, col) { const a = Math.atan2(y1 - y0, x1 - x0); x.save(); x.fillStyle = col; x.beginPath();\n  x.moveTo(x1, y1); x.lineTo(x1 - 10 * Math.cos(a - .4), y1 - 10 * Math.sin(a - .4)); x.lineTo(x1 - 10 * Math.cos(a + .4), y1 - 10 * Math.sin(a + .4)); x.fill(); x.restore(); }\n\nlet s = +(P.get('s') ?? 0.0), mode = P.get('mode') === 'mod' ? 'mod' : 'mesa', playing = !STILL && !P.has('s');\n// ---------- top plot: internal energy vs temperature ----------\nfunction drawE() {\n  const [x, w, h] = fit(document.getElementById('eplot')); x.clearRect(0, 0, w, h);\n  const L0 = 56, R0 = w - 12, T0 = 12, B0 = h - 30;\n  const X = c => L0 + (R0 - L0) * c, Y = e => B0 - (B0 - T0) * (e - 0.08) / 0.9;\n  const st = state(s);\n  // axes\n  line(x, [[L0, T0], [L0, B0], [R0, B0]], C.muted, 1.5);\n  label(x, 'temperature, cooling to the right \u2192', R0, B0 + 16, { align: 'right', col: C.muted, size: 13, halo: false });\n  x.save(); x.translate(18, (T0 + B0) / 2); x.rotate(-Math.PI / 2); label(x, 'internal energy of the zone', 0, 0, { align: 'center', col: C.muted, size: 13, halo: false }); x.restore();\n  // branches\n  line(x, [[X(0), Y(El(0))], [X(1), Y(El(1))]], C.muted, 1.5, [5, 5]);\n  line(x, [[X(0), Y(Es(0))], [X(1), Y(Es(1))]], C.muted, 1.5, [5, 5]);\n  label(x, 'liquid', X(0.02), Y(El(0.02)) - 14, { col: C.muted, size: 13 });\n  label(x, 'solid (lower by the latent heat)', X(0.98), Y(Es(0.98)) + 16, { col: C.muted, size: 13, align: 'right' });\n  // window\n  const wx0 = X(st.cm - HW), wx1 = X(st.cm + HW);\n  x.save(); x.fillStyle = mode === 'mesa' ? C.mesa : C.good; x.globalAlpha = .12; x.fillRect(wx0, T0, wx1 - wx0, B0 - T0); x.restore();\n  label(x, mode === 'mesa' ? 'blur window' : 'blend window', (wx0 + wx1) / 2, T0 + 10, { align: 'center', size: 12, col: mode === 'mesa' ? C.mesa : C.good, bold: true });\n  // old window ghost after shift\n  if (s > 1) { x.save(); x.strokeStyle = C.muted; x.setLineDash([3, 4]); x.strokeRect(X(CM1 - HW), T0, X(CM1 + HW) - X(CM1 - HW), B0 - T0); x.restore();\n    label(x, 'before carbon', X(CM1), B0 - 10, { align: 'center', size: 11, col: C.muted }); }\n  const N = 240, pts = k => Array.from({ length: N + 1 }, (_, i) => { const c = i / N; return [X(c), Y(k(c))]; });\n  if (mode === 'mesa') {\n    // Skye energy: sharp cliff\n    line(x, pts(c => c > st.cm ? Es(c) : El(c)), C.ink, 3);\n    label(x, 'melting cliff', X(st.cm) + 8, (Y(El(st.cm)) + Y(Es(st.cm))) / 2, { size: 13, bold: true });\n    // what MESA feeds in: smooth S, drawn for the current window\n    line(x, pts(c => El(c) - L * S(c, st.cm)), C.mesa, 2.5, [8, 5]);\n    // the zone's booked energy: liquid branch minus everything fed so far\n    const zx = X(st.c), zSkye = Y(st.drop ? Es(st.c) : El(st.c)), zFed = Y(El(st.c) - L * st.fed);\n    // vertical bracket showing the fed amount\n    if (st.fed > 0.01) { line(x, [[zx + 14, Y(El(st.c))], [zx + 14, zFed]], C.mesa, 3);\n      label(x, 'fed by MESA', zx + 20, (Y(El(st.c)) + zFed) / 2, { size: 12, col: C.mesa, bold: true }); }\n    if (st.fed > 1.01) { line(x, [[zx + 14, Y(Es(st.c))], [zx + 14, zFed]], C.bad, 5);\n      label(x, 'paid twice', zx + 20, (Y(Es(st.c)) + zFed) / 2 + 8, { size: 13, col: C.bad, bold: true }); }\n    dot(x, zx, zSkye, st.carbon, 'zone (Skye energy)');\n    x.save(); x.fillStyle = C.mesa; x.beginPath(); x.arc(zx, zFed, 5, 0, 7); x.fill(); x.restore();\n  } else {\n    line(x, pts(c => El(c) - L * S(c, st.cm)), C.good, 3.5);\n    label(x, 'Skye energy, continuous', X(st.cm + HW) + 8, Y(Es(st.cm + HW)) - 14, { size: 13, bold: true, col: C.good });\n    dot(x, X(st.c), Y(El(st.c) - L * st.smooth), st.carbon, 'zone');\n  }\n  if (s > 1 && s < 2.15) { const y = Y(El(CM1)) - 30; line(x, [[X(CM1), y], [X(CM1 + (CM2 - CM1) * Math.min(1, (s - 1))), y]], C.carb, 2.5);\n    arrowHead(x, X(CM1), y, X(CM1 + (CM2 - CM1) * Math.min(1, s - 1)), y, C.carb);\n    label(x, 'carbon lowers the melting point', X((CM1 + CM2) / 2), y - 14, { align: 'center', size: 13, col: C.carb, bold: true }); }\n}\nfunction dot(x, px, py, carbon, txt) { x.save(); x.fillStyle = C.carb; x.globalAlpha = .25 + .75 * carbon; x.beginPath(); x.arc(px, py, 9, 0, 7); x.fill();\n  x.globalAlpha = 1; x.strokeStyle = C.ink; x.lineWidth = 2.5; x.stroke(); x.restore(); label(x, txt, px - 14, py - 16, { size: 12, bold: true, align: 'right' }); }\n\n// ---------- bottom plot: running totals over the zone's history ----------\nfunction drawT() {\n  const [x, w, h] = fit(document.getElementById('tplot')); x.clearRect(0, 0, w, h);\n  const L0 = 104, R0 = w - 190, T0 = 18, B0 = h - 24;\n  const X = v => L0 + (R0 - L0) * v / 3, Y = v => B0 - (B0 - T0) * v / 1.45;\n  line(x, [[L0, T0], [L0, B0], [R0, B0]], C.muted, 1.5);\n  [1, 2].forEach(k => line(x, [[X(k), T0], [X(k), B0]], C.rule, 1, [3, 4]));\n  ['1. cools in', '2. carbon arrives', '3. cools through'].forEach((t, i) => label(x, t, X(i + .5), B0 + 13, { align: 'center', size: 12, col: C.muted, halo: false }));\n  line(x, [[L0, Y(1)], [R0, Y(1)]], C.muted, 1, [2, 3]); label(x, 'one latent heat', L0 - 6, Y(1), { align: 'right', size: 11, col: C.muted, halo: false });\n  label(x, '0', L0 - 6, Y(0), { align: 'right', size: 11, col: C.muted, halo: false });\n  const N = 300, upto = Math.max(0, s);\n  const tr = f => Array.from({ length: N + 1 }, (_, i) => { const v = upto * i / N; return [X(v), Y(f(state(v)))]; });\n  if (mode === 'mesa') {\n    // run A reference: a zone that never receives carbon\n    label(x, 'running totals for this zone', L0 + 8, T0, { size: 12, col: C.muted, bold: true });\n    line(x, tr(q => q.drop), C.ink, 3);\n    line(x, tr(q => q.fed), C.mesa, 3, [8, 5]);\n    const e = state(upto);\n    label(x, 'energy dropped at the cliff', R0 + 6, Y(e.drop) + (e.drop ? 10 : -10), { size: 12, bold: true, col: C.ink });\n    label(x, 'heat fed by MESA', R0 + 6, Y(e.fed) - (e.drop ? 10 : -10), { size: 12, bold: true, col: C.mesa });\n    if (e.fed - e.drop > 0.05 && upto > 2.6) { line(x, [[X(upto) + 2, Y(1)], [X(upto) + 2, Y(e.fed)]], C.bad, 5);\n      label(x, 'extra: energy created', X(upto) - 8, (Y(1) + Y(e.fed)) / 2, { align: 'right', size: 13, bold: true, col: C.bad }); }\n  } else {\n    label(x, 'running totals for this zone', L0 + 8, T0, { size: 12, col: C.muted, bold: true });\n    line(x, tr(q => q.smooth), C.good, 3.5);\n    const e = state(upto);\n    label(x, 'heat released =', R0 + 6, Y(e.smooth) - 8, { size: 12, bold: true, col: C.good });\n    label(x, 'energy the zone lost', R0 + 6, Y(e.smooth) + 8, { size: 12, bold: true, col: C.good });\n    if (upto > 2.9) label(x, 'counted once', X(2.5), Y(1) - 14, { align: 'center', size: 13, bold: true, col: C.good });\n  }\n}\n// ---------- text ----------\nconst TXT = {\n  mesa: [\n    ['The zone cools into the blur window', 'Skye treats melting as a sharp switch: the zone\u2019s energy drops by the latent heat in one step at the melting point (the cliff). To keep the solver stable, MESA feeds that latent heat in smoothly across a narrow window, half before the crossing and half after.',\n     'For a zone that simply cools through (run A), the heat fed and the drop cancel.'],\n    ['Carbon arrives and the cliff slides away', 'Phase separation below hands carbon to this liquid zone while it sits in the window. More carbon lowers its melting point, so at the same temperature the cliff and its window move to colder: the zone is back on the liquid side.',\n     'The heat already fed is not taken back. The smoothed term follows only temperature and density, not composition.'],\n    ['It cools through again and is fed again', 'The zone cools through the new window and is fed the full latent heat again, while its energy drops by only one latent heat at the cliff. The part fed before the carbon arrived is paid twice.',\n     'Measured: 4.3 \u00d7 10\u2074\u2075 erg in run B (4.1 in run C), 29% of the latent heat of the crystallized mass (Section 8.3.6).'],\n  ],\n  mod: [\n    ['Modified MESA: the energy is continuous', 'The one line Skye change blends the liquid and solid free energies smoothly, over the same width as the blur window. The latent heat now sits in the heat capacity, so the heat released follows the zone\u2019s own energy.',\n     'Run A barely changes: 7.965 and 7.971 vs 7.976 Gyr, 0.1% (Section 8.3.6).'],\n    ['Carbon arrives', 'Carbon lowers the melting point and the smooth curve moves to colder. The zone\u2019s energy moves with the curve, back toward the liquid side. Its heat bookkeeping follows its energy, so nothing released earlier is left over.',\n     'Nothing is booked that the zone\u2019s own energy does not account for.'],\n    ['It cools through once', 'Cooling through the window, the zone releases its latent heat, and the total matches the energy it lost: nothing is double counted.',\n     'This removes most of the energy created at the transition. One smoothing width was tested, and the corrected delay is still not converged.'],\n  ],\n};\nfunction updateText() { const i = Math.min(2, Math.floor(Math.min(s, 2.999))); const t = TXT[mode][i];\n  document.getElementById('stepNum').textContent = `Step ${i + 1} of 3`; document.getElementById('stepHead').textContent = t[0];\n  document.getElementById('stepText').textContent = t[1]; const b = document.getElementById('boxText'); b.textContent = t[2]; b.className = 'box' + (mode === 'mod' ? ' fix' : '');\n  document.getElementById('modeTxt').textContent = mode === 'mesa' ? 'MESA' : 'Modified MESA';\n  document.getElementById('modeTxt').style.color = mode === 'mesa' ? 'var(--mesa)' : 'var(--good)';\n  document.getElementById('key').innerHTML = mode === 'mesa'\n    ? '<span class=\"ln\"><i style=\"border-color:var(--ink)\"><\/i>Skye energy (sharp switch)<\/span><span class=\"ln\"><i style=\"border-color:var(--mesa);border-top-style:dashed\"><\/i>latent heat MESA feeds in (smoothed)<\/span><span class=\"ln\"><i style=\"border-color:var(--bad)\"><\/i>paid twice<\/span><span class=\"src\">Mechanism: Section 8.3.6. Shapes and sizes schematic.<\/span>'\n    : '<span class=\"ln\"><i style=\"border-color:var(--good)\"><\/i>Skye energy, continuous (Modified MESA)<\/span><span class=\"src\">Mechanism: Section 8.3.6. Shapes and sizes schematic.<\/span>'; }\n// ---------- wiring ----------\nconst prog = document.getElementById('prog'), playBtn = document.getElementById('play');\nfunction setMode(m) { mode = m; document.getElementById('mMesa').setAttribute('aria-pressed', m === 'mesa'); document.getElementById('mMod').setAttribute('aria-pressed', m === 'mod'); }\ndocument.getElementById('mMesa').onclick = () => { setMode('mesa'); s = 0; playing = true; playBtn.textContent = 'Pause'; };\ndocument.getElementById('mMod').onclick = () => { setMode('mod'); s = 0; playing = true; playBtn.textContent = 'Pause'; };\n[1, 2, 3].forEach(k => document.getElementById('s' + k).onclick = () => { s = k - 1; playing = true; playBtn.textContent = 'Pause'; stopAt = k; });\nlet stopAt = 3;\nplayBtn.onclick = () => { if (!playing && s >= 2.999) s = 0; stopAt = 3; playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };\nprog.oninput = () => { s = +prog.value; playing = false; playBtn.textContent = 'Play'; };\nconst themeBtn = document.getElementById('theme');\nfunction syncTheme() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; syncTheme(); };\nnew MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);\nif (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');\nsetMode(mode); syncTheme();\nif (playing) playBtn.textContent = 'Pause';\nif (matchMedia('(prefers-reduced-motion: reduce)').matches && !P.has('s')) { s = 3; playing = false; playBtn.textContent = 'Play'; }\nlet last = performance.now();\nfunction frame(now) { const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;\n  if (playing) { s = Math.min(stopAt, s + dt * 0.32); if (s >= stopAt) { playing = false; playBtn.textContent = 'Play'; } }\n  prog.value = s; updateText(); drawE(); drawT(); requestAnimationFrame(frame); }\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body><\/html>", "gap": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Big Numbers, Tiny Difference<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: 16:9 stage. Left: the two energies and a magnifier on their gap, with an error slider. Right: failure modes. Same tokens as Visuals 1 and 2. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2;\n  --oxy:#1f5fc4; --carb:#e27a14; --mesa:#7a3fb0; --bad:#c8282d; --good:#1d8a5a;\n  --liq:#7fa6dc; --sol:#2c4f86;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a; --liq:#5d7fae; --sol:#a9c4ee; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --carb:#f39a3d; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a; --liq:#5d7fae; --sol:#a9c4ee; color-scheme:dark}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:18px 22px 14px;\n  display:grid;grid-template-rows:auto 1fr auto;gap:10px;aspect-ratio:16/9;min-height:0}\nheader.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\nh1{font-size:clamp(20px,2.2vw,30px);margin:0;text-wrap:balance}\n.sub{color:var(--muted);font-size:clamp(13px,1.2vw,16px)}\n.body{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;min-height:0}\n.col{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}\n.col h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}\ncanvas{display:block;width:100%;flex:1;min-height:0}\n.err{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font-size:14px}\n.err output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:7ch;text-align:right}\ninput[type=range]{width:100%;accent-color:var(--bad)}\n.analogy{font-size:clamp(12.5px,1.02vw,15px);border-left:4px solid var(--ink);padding:5px 10px;background:var(--bg);border-radius:0 4px 4px 0;margin:0}\n.bench{font-size:clamp(12.5px,1.02vw,15px);margin:0;border-left:4px solid var(--good);padding:5px 10px;background:var(--bg);border-radius:0 4px 4px 0}\nfooter.key{font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}\nfooter.key span:last-child{margin-left:auto}\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.controls button{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){#stage{aspect-ratio:auto}.body{grid-template-columns:1fr}#bars{height:380px}#modes{height:420px}footer.key span:last-child{margin-left:0}}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"The latent heat is a small difference of two big numbers\">\n  <header class=\"top\">\n    <h1>The latent heat is a tiny difference of two big numbers<\/h1>\n    <span class=\"sub\">energy per ion, in units of kT<\/span>\n  <\/header>\n  <div class=\"body\">\n    <div class=\"col\">\n      <h2>Liquid and solid energies, and their gap<\/h2>\n      <canvas id=\"bars\" role=\"img\" aria-label=\"Two bars near minus 150 kT and a magnified view of the gap between them\"><\/canvas>\n      <div class=\"err\">\n        <label for=\"eps\">Error added to the solid's energy<\/label>\n        <input id=\"eps\" type=\"range\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0.1\">\n        <output id=\"epsOut\" for=\"eps\">+0.10%<\/output>\n      <\/div>\n      <p class=\"analogy\" id=\"analogy\"><b>Like a mass difference between two heavy particles:<\/b> the neutron and proton masses are 939.565 and 938.272 MeV, a difference of 1.293 MeV. An error of 0.1% in one mass (about 0.94 MeV) is most of the difference.<\/p>\n    <\/div>\n    <div class=\"col\">\n      <h2>Plausible mistakes, and what they do to the result<\/h2>\n      <canvas id=\"modes\" role=\"img\" aria-label=\"Bar chart of latent heat values from Table 6-5 failure modes compared with the correct values\"><\/canvas>\n      <p class=\"bench\"><b>Consistency benchmark:<\/b> at the Baiko and Chugunov melting point (\u0393<sub>m<\/sub> = 175.6388), the assembled value is 0.751327 kT against their published 0.752100 kT, 0.1% below (Eq. 6-31, Table 6-1). This checks consistency within one plasma model; it is not an accuracy claim.<\/p>\n    <\/div>\n  <\/div>\n  <footer class=\"key\"><span>The leading quantum corrections are identical in both phases and cancel in the difference.<\/span><span>Sources: Fig 6-1, Table 6-1, Table 6-5. Bar heights near \u2212150 kT are approximate.<\/span><\/footer>\n<\/section>\n<div class=\"controls\">\n  <button id=\"zero\" type=\"button\">No error<\/button>\n  <button id=\"p1\" type=\"button\">+0.1%<\/button>\n  <button id=\"m1\" type=\"button\">\u22120.1%<\/button>\n  <button id=\"theme\" type=\"button\">Dark<\/button>\n<\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 3. The slider uses an energy of 150 kT per ion, the round size from Fig 6-1, so 0.1% shifts one bar by about 0.15 kT; Table 6-5 (mode iii) gives about 18% for this case.<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst P = new URLSearchParams(location.search);\nif (P.has('still')) document.body.classList.add('still');\nconst E = 150, GAP = 0.843;            // Fig 6-1: each energy about -150 kT; harmonic difference 0.843 kT at \u0393 = 172\nlet eps = P.has('eps') ? +P.get('eps') : 0.1;  // percent\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nlet C = {};\nfunction readColors() { ['--ink','--muted','--rule','--bad','--good','--liq','--sol','--stage','--bg','--mesa','--oxy'].forEach(k => C[k.slice(2)] = css(k));\n  const th = document.documentElement.dataset.theme; C.dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches); }\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction label(x, s, px, py, o = {}) { x.save(); x.font = `${o.bold ? 700 : 400} ${o.size || 14}px ${o.mono ? 'IBM Plex Mono' : 'Atkinson Hyperlegible'}, sans-serif`;\n  x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'middle';\n  if (o.halo !== false) { x.lineWidth = 4; x.strokeStyle = C.stage; x.lineJoin = 'round'; x.strokeText(s, px, py); }\n  x.fillStyle = o.col || C.ink; x.fillText(s, px, py); x.restore(); }\n\nfunction drawBars() {\n  const [x, w, h] = fit(document.getElementById('bars')); x.clearRect(0, 0, w, h);\n  const top = 24, bot = h - 20, bw = Math.min(70, w * .12), x1 = 58, x2 = x1 + bw + 18;\n  const Y = v => top + (bot - top) * (-v) / 160;     // 0 at top, -160 at bottom\n  // axis\n  x.strokeStyle = C.muted; x.lineWidth = 1.5; x.beginPath(); x.moveTo(x1 - 10, top); x.lineTo(x1 - 10, bot); x.stroke();\n  [0, -50, -100, -150].forEach(v => { x.beginPath(); x.moveTo(x1 - 16, Y(v)); x.lineTo(x1 - 10, Y(v)); x.stroke();\n    label(x, String(v).replace('-', '\u2212'), x1 - 20, Y(v), { align: 'right', size: 12, mono: true, col: C.muted, halo: false }); });\n  label(x, 'kT', x1 - 20, top - 14, { align: 'right', size: 12, col: C.muted, halo: false });\n  const solid = -E - GAP / 2 - eps / 100 * E, liquid = -E + GAP / 2;\n  x.fillStyle = C.liq; x.fillRect(x1, Y(0), bw, Y(liquid) - Y(0));\n  x.fillStyle = C.sol; x.fillRect(x2, Y(0), bw, Y(solid) - Y(0));\n  label(x, 'liquid', x1 + bw / 2, Y(-20), { align: 'center', bold: true, col: C.dark ? C.ink : '#ffffff', halo: false });\n  label(x, 'solid', x2 + bw / 2, Y(-20), { align: 'center', bold: true, col: C.dark ? '#14181f' : '#ffffff', halo: false });\n  [x1, x2].forEach((bx, i) => label(x, '\u2248 \u2212150', bx + bw / 2, Y(-80), { align: 'center', bold: true, size: 14, col: i ? (C.dark ? '#14181f' : '#ffffff') : (C.dark ? C.ink : '#ffffff'), halo: false }));\n  // magnifier box around bar ends\n  const mx0 = x1 - 4, mx1 = x2 + bw + 4, my = Y(-E), mh = 16;\n  x.strokeStyle = C.ink; x.lineWidth = 2; x.strokeRect(mx0, my - mh, mx1 - mx0, 2 * mh);\n  // magnified panel\n  const px0 = x2 + bw + 70, px1 = w - 10, py0 = top, py1 = bot - 10;\n  x.strokeStyle = C.muted; x.lineWidth = 1; x.setLineDash([4, 4]); x.beginPath(); x.moveTo(mx1, my - mh); x.lineTo(px0, py0); x.moveTo(mx1, my + mh); x.lineTo(px0, py1); x.stroke(); x.setLineDash([]);\n  x.fillStyle = C.bg; x.fillRect(px0, py0, px1 - px0, py1 - py0); x.strokeStyle = C.ink; x.lineWidth = 2; x.strokeRect(px0, py0, px1 - px0, py1 - py0);\n  // magnified scale: center -150, span \u00b11.6 kT\n  const span = 1.6, MY = v => (py0 + py1) / 2 - (v + E) / span * (py1 - py0) / 2;\n  label(x, 'magnified about \u00d7 50', px1 - 10, py0 + 14, { align: 'right', size: 13, bold: true, col: C.muted, halo: false }); if (0) label(x, '', 0, 0, { size: 13, bold: true, col: C.muted, halo: false });\n  for (let v = -E - 1.0; v <= -E + 1.01; v += 0.5) { const y = MY(v); x.strokeStyle = C.rule; x.lineWidth = 1; x.beginPath(); x.moveTo(px0, y); x.lineTo(px0 + 8, y); x.stroke();\n    label(x, (v + E >= 0 ? '+' : '\u2212') + Math.abs(v + E).toFixed(1), px0 + 12, y, { size: 11, mono: true, col: C.muted, halo: false }); }\n  label(x, 'kT from \u2212150', px0 + 12, py1 - 12, { size: 11, col: C.muted, halo: false });\n  const bx1 = px0 + 58, bx2 = bx1 + 52, bwm = 40;\n  const clipY = v => Math.max(py0 + 2, Math.min(py1 - 2, MY(v)));\n  x.fillStyle = C.liq; x.fillRect(bx1, py0 + 26, bwm, clipY(liquid) - py0 - 26);\n  x.fillStyle = C.sol; x.fillRect(bx2, py0 + 26, bwm, clipY(solid) - py0 - 26);\n  // true gap reference and current gap\n  const trueSolid = -E - GAP / 2;\n  x.strokeStyle = C.ink; x.setLineDash([5, 4]); x.lineWidth = 1.5; x.beginPath(); x.moveTo(bx2 - 6, MY(trueSolid)); x.lineTo(bx2 + bwm + 6, MY(trueSolid)); x.stroke(); x.setLineDash([]);\n  const gx = bx2 + bwm + 26, gap = liquid - solid, err = (gap - GAP) / GAP * 100;\n  x.strokeStyle = C.ink; x.lineWidth = 2.5; x.beginPath(); x.moveTo(gx, MY(liquid)); x.lineTo(gx, MY(trueSolid)); x.stroke();\n  [MY(liquid), MY(trueSolid)].forEach(y => { x.beginPath(); x.moveTo(gx - 6, y); x.lineTo(gx + 6, y); x.stroke(); });\n  if (Math.abs(eps) > 0.001) { x.strokeStyle = C.bad; x.lineWidth = 5; x.beginPath(); x.moveTo(gx + 10, MY(trueSolid)); x.lineTo(gx + 10, clipY(solid)); x.stroke(); }\n  label(x, 'gap = latent heat', gx + 18, MY(liquid) + 10, { size: 13, bold: true });\n  label(x, '0.843 kT at \u0393 = 172', gx + 18, MY(liquid) + 28, { size: 13, mono: true });\n  if (Math.abs(eps) > 0.001) {\n    const ys = Math.max(MY(trueSolid) + 22, Math.min(py1 - 40, clipY(solid)));\n    label(x, `now ${gap.toFixed(3)} kT`, gx + 18, ys, { size: 13, bold: true, mono: true, col: C.bad });\n    label(x, `${err >= 0 ? '+' : '\u2212'}${Math.abs(err).toFixed(0)}% in the latent heat`, gx + 18, ys + 18, { size: 13, bold: true, col: C.bad });\n  }\n}\n\nconst MODES = [   // Table 6-5, values in kT\n  { name: 'Correct (harmonic only)', v: 0.843, kind: 'ok' },\n  { name: 'Different published coefficient set', v: 0.839, kind: 'warn', note: '\u22120.5%' },\n  { name: '0.1% error in one phase (mode iii)', v: null, kind: 'bad', note: 'about \u00b118%' },\n  { name: 'Quantum term in solid, not in liquid', v: 0.440, kind: 'bad', note: '\u221248%' },\n  { name: 'Published misprint transcribed', v: 0.311, kind: 'bad', note: '\u221263%' },\n  { name: 'Fit evaluated at the wrong argument', v: 1.549, kind: 'bad', note: '+84%' },\n];\nfunction drawModes() {\n  const [x, w, h] = fit(document.getElementById('modes')); x.clearRect(0, 0, w, h);\n  const lw = Math.min(250, w * .46), X0 = lw + 8, X1 = w - 70, top = 56, axisY = h - 22;\n  const X = v => X0 + (X1 - X0) * v / 1.7;\n  const n = MODES.length, rowH = (axisY - top - 8) / n, bh = Math.min(26, rowH * .55);\n  // axis ticks\n  x.strokeStyle = C.rule; x.lineWidth = 1;\n  [0, 0.5, 1.0, 1.5].forEach(v => { x.beginPath(); x.moveTo(X(v), top); x.lineTo(X(v), axisY); x.stroke();\n    label(x, v.toFixed(1), X(v), axisY + 12, { align: 'center', size: 12, mono: true, col: C.muted, halo: false }); });\n  label(x, 'kT', X1 + 30, axisY + 12, { size: 12, col: C.muted, halo: false });\n  MODES.forEach((m, i) => {\n    const yc = top + rowH * (i + .5) + 4;\n    label(x, m.name, lw, yc, { align: 'right', size: Math.max(12, Math.min(14.5, w / 40)), bold: i === 0, halo: false });\n    const col = m.kind === 'ok' ? C.good : m.kind === 'warn' ? C.muted : C.bad;\n    x.fillStyle = col;\n    if (m.v != null) { x.fillRect(X(0), yc - bh / 2, X(m.v) - X(0), bh);\n      label(x, m.v.toFixed(3), X(m.v) + 6, yc - (m.note ? 7 : 0), { size: 12.5, mono: true, bold: true, halo: false });\n      if (m.note) label(x, m.note, X(m.v) + 6, yc + 9, { size: 12, col, bold: true, halo: false });\n    } else { // range bar for \u00b118%\n      const lo = GAP * 0.82, hi = GAP * 1.18; x.globalAlpha = .35; x.fillRect(X(0), yc - bh / 2, X(lo) - X(0), bh); x.globalAlpha = 1;\n      x.fillRect(X(lo), yc - bh / 2, X(hi) - X(lo), bh);\n      label(x, m.note, X(hi) + 6, yc, { size: 12, col, bold: true, halo: false }); }\n  });\n  // reference lines: correct harmonic, assembled with anharmonic, published\n  const ref = (v, col, txt, dy) => { x.strokeStyle = col; x.lineWidth = 2; x.setLineDash([6, 4]); x.beginPath(); x.moveTo(X(v), dy || top); x.lineTo(X(v), axisY); x.stroke(); x.setLineDash([]); };\n  ref(GAP, C.good); ref(0.752, C.ink, '', 4);\n  label(x, '0.752 published', X(0.752) - 6, 12, { align: 'right', size: 12, bold: true });\n  label(x, '0.751 assembled', X(0.752) - 6, 28, { align: 'right', size: 12, bold: true, col: C.good });\n  label(x, 'with anharmonic, at melting', X(0.752) - 6, 44, { align: 'right', size: 11, col: C.muted });\n}\nconst epsEl = document.getElementById('eps'), out = document.getElementById('epsOut');\nfunction setEps(v) { eps = v; epsEl.value = v; out.textContent = (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(2) + '%'; draw(); }\nepsEl.oninput = () => setEps(+epsEl.value);\ndocument.getElementById('zero').onclick = () => setEps(0);\ndocument.getElementById('p1').onclick = () => setEps(0.1);\ndocument.getElementById('m1').onclick = () => setEps(-0.1);\nconst themeBtn = document.getElementById('theme');\nfunction syncTheme() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; draw(); }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; };\nnew MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);\nfunction draw() { if (!C.ink) return; drawBars(); drawModes(); }\nnew ResizeObserver(draw).observe(document.getElementById('stage'));\nif (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');\nreadColors(); setEps(eps); syncTheme();\ndocument.fonts && document.fonts.ready.then(draw);\n})();\n<\/script>\n<\/body><\/html>", "runs": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Three Runs and the Delay<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: 16:9 stage. Left: cooling curves with the delays at log L = -4.4. Right: stacked delay bar with the heating spread, then MESA vs Modified MESA totals. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2;\n  --oxy:#1f5fc4; --mesa:#7a3fb0; --bad:#c8282d; --good:#1d8a5a;\n  --runA:#8a94a3; --runB:#1f8a96; --runC:#14181f; --redis:#1f8a96; --heat:#7a3fb0;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a;\n  --runA:#7d8796; --runB:#3fbccb; --runC:#eef2f7; --redis:#3fbccb; --heat:#b07ae0; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440;\n  --oxy:#5b97f0; --mesa:#b07ae0; --bad:#ff6b6b; --good:#4cc38a;\n  --runA:#7d8796; --runB:#3fbccb; --runC:#eef2f7; --redis:#3fbccb; --heat:#b07ae0; color-scheme:dark}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:18px 22px 14px;\n  display:grid;grid-template-rows:auto 1fr auto;gap:10px;aspect-ratio:16/9;min-height:0}\nheader.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\nh1{font-size:clamp(20px,2.2vw,30px);margin:0;text-wrap:balance}\n.sub{color:var(--muted);font-size:clamp(13px,1.2vw,16px)}\n.body{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;min-height:0}\n.col{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}\n.right{display:grid;grid-template-rows:1.15fr 1fr;gap:12px;min-height:0}\n.col h2,.right h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}\n.cell{display:flex;flex-direction:column;gap:4px;min-height:0}\ncanvas{display:block;width:100%;flex:1;min-height:0}\n.runs{font-size:clamp(12.5px,1.02vw,15px);margin:0}\n.runs b{font-weight:700}\nfooter.key{font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}\nfooter.key span:last-child{margin-left:auto}\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.controls button{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){#stage{aspect-ratio:auto}.body{grid-template-columns:1fr}#curves{height:380px}.right{height:560px}footer.key span:last-child{margin-left:0}}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"Three runs of the 0.6113 solar mass model and the cooling delay\">\n  <header class=\"top\">\n    <h1>Three runs of the same star, and the cooling delay<\/h1>\n    <span class=\"sub\">0.6113 M\u2609 model, delays measured at log L/L\u2609 = \u22124.4<\/span>\n  <\/header>\n  <div class=\"body\">\n    <div class=\"col\">\n      <h2>Cooling curves (schematic shapes through the Table 8-1 ages)<\/h2>\n      <canvas id=\"curves\" role=\"img\" aria-label=\"Luminosity versus age for runs A, B and C, diverging after crystallization starts\"><\/canvas>\n      <p class=\"runs\"><b style=\"color:var(--runA)\">A<\/b> no phase separation &nbsp; <b style=\"color:var(--runB)\">B<\/b> phase separation moves C and O, its heating term off &nbsp; <b>C<\/b> full treatment<\/p>\n    <\/div>\n    <div class=\"right\">\n      <div class=\"cell\"><h2>Where the delay comes from (MESA)<\/h2><canvas id=\"stack\" role=\"img\" aria-label=\"Stacked bar: redistribution part plus heating part of the delay, with the heating spread across settings\"><\/canvas><\/div>\n      <div class=\"cell\"><h2>Total delay: MESA vs Modified MESA<\/h2><canvas id=\"totals\" role=\"img\" aria-label=\"Range bars of the total delay for MESA and Modified MESA\"><\/canvas><\/div>\n    <\/div>\n  <\/div>\n  <footer class=\"key\"><span>Neither total is converged: the heating part varies by a factor of 2.7 across timestep and mesh settings.<\/span><span>Sources: Table 8-1, Table 8-2, abstract.<\/span><\/footer>\n<\/section>\n<div class=\"controls\"><button id=\"theme\" type=\"button\">Dark<\/button><\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 4. Only the three ages at log L/L\u2609 = \u22124.4 are real data in the left panel; the curve shapes and the luminosity where they start to separate are schematic. Run A's curve has the slope of simple Mestel cooling.<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst P = new URLSearchParams(location.search);\nif (P.has('still')) document.body.classList.add('still');\nconst AGE = { A: 8.208, B: 8.659, C: 8.758 };          // Table 8-1, MESA stoc
