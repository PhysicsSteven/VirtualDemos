k timestep, ages at log L = -4.4\nconst HEAT = [0.069, 0.155, 0.057], HEAT_STOCK = 0.098;  // Table 8-2, C - B\nconst MESA_TOT = [0.54, 0.61], MOD_TOT = [0.41, 0.45];   // Table 8-2 and abstract\nconst LREF = -4.4, TON = 1.9;\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nlet C = {};\nfunction readColors() { ['--ink','--muted','--rule','--bad','--good','--runA','--runB','--runC','--redis','--heat','--stage','--bg','--mesa'].forEach(k => C[k.slice(2)] = css(k));\n  const th = document.documentElement.dataset.theme; C.dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches); }\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction label(x, s, px, py, o = {}) { x.save(); x.font = `${o.bold ? 700 : 400} ${o.size || 14}px ${o.mono ? 'IBM Plex Mono' : 'Atkinson Hyperlegible'}, sans-serif`;\n  x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'middle';\n  if (o.halo !== false) { x.lineWidth = 4; x.strokeStyle = C.stage; x.lineJoin = 'round'; x.strokeText(s, px, py); }\n  x.fillStyle = o.col || C.ink; x.fillText(s, px, py); x.restore(); }\nfunction seg(x, a, b, col, w, dash) { x.save(); x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); x.restore(); }\n\n// schematic run A: Mestel slope L ~ t^-1.4 through (8.208 Gyr, -4.4)\nconst cA = LREF + 1.4 * Math.log10(AGE.A);\nconst logLA = t => cA - 1.4 * Math.log10(t);\nconst tA = L => Math.pow(10, (cA - L) / 1.4);\nconst LON = logLA(TON);\nconst shiftFrac = L => { const u = (LON - L) / (LON - LREF); return u <= 0 ? 0 : Math.pow(Math.min(u, 1.25), 1.3); };\nconst tRun = (L, k) => tA(L) + (AGE[k] - AGE.A) * shiftFrac(L);\n\nfunction drawCurves() {\n  const [x, w, h] = fit(document.getElementById('curves')); x.clearRect(0, 0, w, h);\n  const L0 = 62, R0 = w - 14, T0 = 14, B0 = h - 40, tmin = 1, tmax = 10.5, ymax = logLA(tmin) + 0.05, ymin = -4.75;\n  const X = t => L0 + (R0 - L0) * (t - tmin) / (tmax - tmin), Y = l => T0 + (B0 - T0) * (ymax - l) / (ymax - ymin);\n  // axes and ticks\n  seg(x, [L0, T0], [L0, B0], C.muted, 1.5); seg(x, [L0, B0], [R0, B0], C.muted, 1.5);\n  for (let t = 2; t <= 10; t += 2) { seg(x, [X(t), B0], [X(t), B0 + 6], C.muted, 1.5); label(x, String(t), X(t), B0 + 16, { align: 'center', size: 12, mono: true, col: C.muted, halo: false }); }\n  label(x, 'age (Gyr)', R0, B0 + 32, { align: 'right', size: 13, col: C.muted, halo: false });\n  x.save(); x.translate(16, (T0 + B0) / 2); x.rotate(-Math.PI / 2); label(x, 'log L/L\u2609 (dimmer \u2193)', 0, 0, { align: 'center', size: 13, col: C.muted, halo: false }); x.restore();\n  label(x, '\u22124.4', L0 - 6, Y(LREF), { align: 'right', size: 12, mono: true, bold: true, halo: false });\n  // crystallization onset\n  seg(x, [X(TON), T0], [X(TON), B0], C.rule, 1.5, [4, 4]);\n  label(x, 'crystallization starts \u2248 1.9 Gyr', X(TON) + 6, T0 + 8, { size: 12, col: C.muted });\n  // reference line\n  seg(x, [L0, Y(LREF)], [R0, Y(LREF)], C.muted, 1, [2, 3]);\n  // curves (parametrize by L)\n  const draw = (k, col, wdt) => { x.save(); x.strokeStyle = col; x.lineWidth = wdt; x.beginPath(); let first = true;\n    for (let i = 0; i <= 300; i++) { const L = ymax - (ymax - ymin) * i / 300, t = tRun(L, k); if (t < tmin || t > tmax) continue;\n      first ? x.moveTo(X(t), Y(L)) : x.lineTo(X(t), Y(L)); first = false; } x.stroke(); x.restore(); };\n  draw('A', C.runA, 2.5); draw('B', C.runB, 2.5); draw('C', C.runC, 3);\n  // box marking the zoom region, and the zoom inset\n  const zt0 = 7.9, zt1 = 9.05, zl0 = -4.31, zl1 = -4.49;\n  x.strokeStyle = C.ink; x.lineWidth = 1.5; x.strokeRect(X(zt0), Y(zl0), X(zt1) - X(zt0), Y(zl1) - Y(zl0));\n  const ix0 = L0 + (R0 - L0) * 0.42, ix1 = R0 - 4, iy0 = T0 + 26, iy1 = T0 + (B0 - T0) * 0.56;\n  seg(x, [X(zt0), Y(zl0)], [ix0, iy1], C.muted, 1, [4, 4]); seg(x, [X(zt1), Y(zl0)], [ix1, iy1], C.muted, 1, [4, 4]);\n  x.fillStyle = C.bg; x.fillRect(ix0, iy0, ix1 - ix0, iy1 - iy0); x.strokeStyle = C.ink; x.lineWidth = 2; x.strokeRect(ix0, iy0, ix1 - ix0, iy1 - iy0);\n  const IX = t => ix0 + (ix1 - ix0) * (t - zt0) / (zt1 - zt0), IY = l => iy0 + (iy1 - iy0) * (zl0 - l) / (zl0 - zl1);\n  x.save(); x.beginPath(); x.rect(ix0, iy0, ix1 - ix0, iy1 - iy0); x.clip();\n  seg(x, [ix0, IY(LREF)], [ix1, IY(LREF)], C.muted, 1, [2, 3]);\n  [['A', C.runA, 2.5], ['B', C.runB, 2.5], ['C', C.runC, 3]].forEach(([k, col, wd]) => { x.strokeStyle = col; x.lineWidth = wd; x.beginPath();\n    for (let i = 0; i <= 120; i++) { const L = zl0 - (zl0 - zl1) * i / 120, t = tRun(L, k); i ? x.lineTo(IX(t), IY(L)) : x.moveTo(IX(t), IY(L)); } x.stroke();\n    label(x, k, IX(tRun(zl0 + 0.012, k)) + 8, IY(zl0 + 0.012), { bold: true, size: 15, col }); });\n  x.restore();\n  label(x, 'zoom', ix0 + 8, iy0 + 12, { size: 12, col: C.muted, halo: false });\n  label(x, '\u22124.4', ix0 + 6, IY(LREF) - 10, { size: 12, mono: true, bold: true, col: C.muted });\n  const yb = IY(LREF);\n  [['A', C.runA], ['B', C.runB], ['C', C.runC]].forEach(([k, col]) => { x.fillStyle = col; x.beginPath(); x.arc(IX(AGE[k]), yb, 5.5, 0, 7); x.fill(); });\n  const yl = yb + 34, yl2 = yb + 60;\n  seg(x, [IX(AGE.A), yb + 8], [IX(AGE.A), yl2 + 6], C.runA, 1, [2, 3]); seg(x, [IX(AGE.B), yb + 8], [IX(AGE.B), yl + 6], C.runB, 1, [2, 3]); seg(x, [IX(AGE.C), yb + 8], [IX(AGE.C), yl2 + 6], C.runC, 1, [2, 3]);\n  seg(x, [IX(AGE.A), yl], [IX(AGE.B), yl], C.redis, 5); seg(x, [IX(AGE.B), yl], [IX(AGE.C), yl], C.heat, 5);\n  seg(x, [IX(AGE.A), yl2], [IX(AGE.C), yl2], C.ink, 2.5);\n  label(x, 'B \u2212 A = 0.451 Gyr', (IX(AGE.A) + IX(AGE.B)) / 2, yl - 12, { align: 'center', size: 12.5, bold: true, col: C.redis });\n  label(x, 'C \u2212 B', IX(AGE.C) + 6, yl, { size: 12.5, bold: true, col: C.heat });\n  label(x, 'C \u2212 A = 0.550 Gyr', (IX(AGE.A) + IX(AGE.C)) / 2, yl2 + 14, { align: 'center', size: 12.5, bold: true });\n  label(x, '8.208', IX(AGE.A), yb - 14, { align: 'center', size: 12, mono: true, col: C.runA, bold: true });\n  label(x, '8.659', IX(AGE.B) - 4, yb - 14, { align: 'right', size: 12, mono: true, col: C.runB, bold: true });\n  label(x, '8.758', IX(AGE.C) + 4, yb - 14, { size: 12, mono: true, bold: true });\n  label(x, 'ages at \u22124.4 (Table 8-1, MESA, stock timestep)', ix1 - 8, iy1 - 12, { align: 'right', size: 11.5, col: C.muted, halo: false });\n}\n\nfunction drawStack() {\n  const [x, w, h] = fit(document.getElementById('stack')); x.clearRect(0, 0, w, h);\n  const L0 = 14, R0 = w - 20, vmax = 0.70, X = v => L0 + (R0 - L0) * v / vmax;\n  const y1 = h * 0.34, bh = Math.min(40, h * .2);\n  const redis = AGE.B - AGE.A;   // 0.451\n  // ticks\n  for (let v = 0; v <= 0.7001; v += 0.1) { seg(x, [X(v), y1 - bh / 2 - 6], [X(v), h - 22], C.rule, 1);\n    label(x, v.toFixed(1), X(v), h - 10, { align: 'center', size: 12, mono: true, col: C.muted, halo: false }); }\n  label(x, 'Gyr', R0, h - 26, { align: 'right', size: 12, col: C.muted, halo: false });\n  x.fillStyle = C.redis; x.fillRect(X(0), y1 - bh / 2, X(redis) - X(0), bh);\n  x.fillStyle = C.heat; x.fillRect(X(redis), y1 - bh / 2, X(redis + HEAT_STOCK) - X(redis), bh);\n  label(x, 'redistribution B \u2212 A', X(redis / 2), y1 - bh / 2 - 16, { align: 'center', size: 13, bold: true, col: C.redis });\n  label(x, '0.451', X(redis / 2), y1, { align: 'center', size: 13, bold: true, mono: true, col: '#ffffff', halo: false });\n  label(x, 'heating C \u2212 B', X(redis + HEAT_STOCK) + 4, y1 - bh / 2 - 16, { align: 'center', size: 13, bold: true, col: C.heat });\n  label(x, '0.098', X(redis + HEAT_STOCK / 2), y1, { align: 'center', size: 12, bold: true, mono: true, col: '#ffffff', halo: false });\n  // spread of the heating part across settings\n  const y2 = y1 + bh / 2 + 26, lo = Math.min(...HEAT), hi = Math.max(...HEAT);\n  seg(x, [X(redis + lo), y2], [X(redis + hi), y2], C.heat, 2.5);\n  [lo, hi].forEach(v => seg(x, [X(redis + v), y2 - 7], [X(redis + v), y2 + 7], C.heat, 2.5));\n  [...HEAT, HEAT_STOCK].forEach((v, i) => { x.fillStyle = i === 3 ? C.stage : C.heat; x.strokeStyle = C.heat; x.lineWidth = 2;\n    x.beginPath(); x.arc(X(redis + v), y2, 5, 0, 7); x.fill(); x.stroke(); });\n  label(x, 'C \u2212 B across timestep and mesh settings: 0.057 to 0.155 Gyr', X(redis + hi) + 10 > w * .55 ? X(0) : X(redis + hi) + 10, y2 + 22, { size: 12.5, col: C.heat, bold: true });\n  label(x, 'a factor of 2.7: not converged (Table 8-2)', X(0), y2 + 40, { size: 12.5, col: C.heat });\n}\n\nfunction drawTotals() {\n  const [x, w, h] = fit(document.getElementById('totals')); x.clearRect(0, 0, w, h);\n  const L0 = 136, R0 = w - 150, vmax = 0.70, X = v => L0 + (R0 - L0) * v / vmax;\n  const rows = [['MESA', MESA_TOT, C.mesa, '0.54 to 0.61 Gyr'], ['Modified MESA', MOD_TOT, C.good, '0.41 to 0.45 Gyr']];\n  for (let v = 0; v <= 0.7001; v += 0.1) { seg(x, [X(v), 8], [X(v), h - 22], C.rule, 1);\n    label(x, v.toFixed(1), X(v), h - 10, { align: 'center', size: 12, mono: true, col: C.muted, halo: false }); }\n  label(x, 'Gyr', R0, h - 26, { align: 'right', size: 12, col: C.muted, halo: false });\n  const rh = (h - 40) / 2;\n  rows.forEach(([name, [a, b], col, txt], i) => { const y = 14 + rh * (i + .45), bh = Math.min(30, rh * .42);\n    label(x, name, L0 - 10, y, { align: 'right', size: 15, bold: true, col, halo: false });\n    x.fillStyle = col; x.globalAlpha = .18; x.fillRect(X(0), y - bh / 2, X(a) - X(0), bh); x.globalAlpha = 1;\n    x.fillRect(X(a), y - bh / 2, X(b) - X(a), bh);\n    label(x, txt, X(b) + 8, y, { size: 13, bold: true, mono: true, col });\n    if (i === 1) label(x, 'still not converged; one smoothing width tested', X(0), y + bh / 2 + 14, { size: 12.5, col: C.muted });\n  });\n}\nfunction draw() { if (!C.ink) return; drawCurves(); drawStack(); drawTotals(); }\nconst themeBtn = document.getElementById('theme');\nfunction syncTheme() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; draw(); }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; };\nnew MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);\nnew ResizeObserver(draw).observe(document.getElementById('stage'));\nif (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');\nsyncTheme(); document.fonts && document.fonts.ready.then(draw);\n})();\n<\/script>\n<\/body><\/html>", "gamma": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Coupling Along the Star<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: 16:9 stage. \u0393 vs mass coordinate (log \u0393) with the 175 reference and the 205 to 219 front band | notes. Same tokens as Visuals 1 to 4. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2;\n  --oxy:#1f5fc4; --carb:#e27a14; --band:#1f5fc4; --ref:#c8282d;\n  --c1:#9db7df; --c2:#6a92cf; --c3:#3c6dbb; --c4:#1d3f7a;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440; --oxy:#5b97f0; --carb:#f39a3d; --band:#5b97f0; --ref:#ff6b6b;\n  --c1:#3d5a85; --c2:#5479b4; --c3:#7ea2dc; --c4:#c2d6f5; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440; --oxy:#5b97f0; --carb:#f39a3d; --band:#5b97f0; --ref:#ff6b6b;\n  --c1:#3d5a85; --c2:#5479b4; --c3:#7ea2dc; --c4:#c2d6f5; color-scheme:dark}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:18px 22px 14px;\n  display:grid;grid-template-rows:auto 1fr auto;gap:10px;aspect-ratio:16/9;min-height:0}\nheader.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\nh1{font-size:clamp(20px,2.2vw,30px);margin:0;text-wrap:balance}\n.tag{font-size:13px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--muted);color:var(--muted);padding:1px 8px;border-radius:3px}\n.body{display:grid;grid-template-columns:2fr 1fr;gap:24px;min-height:0}\ncanvas{display:block;width:100%;height:100%;min-height:0}\n#notes{display:flex;flex-direction:column;gap:10px;font-size:clamp(13px,1.1vw,16px);min-width:0}\n#notes p{margin:0}\n.box{border-left:4px solid var(--ref);padding:6px 10px;background:var(--bg);border-radius:0 4px 4px 0}\nfooter.key{font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}\nfooter.key span:last-child{margin-left:auto}\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.controls button{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\n.controls button[aria-pressed=\"true\"]{background:var(--ink);color:var(--stage)}\nbutton:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){#stage{aspect-ratio:auto}.body{grid-template-columns:1fr}#plot{height:420px}footer.key span:last-child{margin-left:0}}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"Coupling parameter along the star at several luminosities\">\n  <header class=\"top\">\n    <h1>The \u0393 = 175 surface runs ahead of the real front<\/h1>\n    <span class=\"tag\">Schematic<\/span>\n  <\/header>\n  <div class=\"body\">\n    <canvas id=\"plot\" role=\"img\" aria-label=\"Gamma versus mass coordinate at four luminosities, with the Gamma 175 reference line and the 205 to 219 front band\"><\/canvas>\n    <div id=\"notes\">\n      <p><b>\u0393<\/b> is the ion Coulomb energy over the thermal energy. It is largest at the dense center and rises everywhere as the star cools, so each dimmer curve sits higher.<\/p>\n      <p><b>\u0393 = 175<\/b> is the classical one component plasma melting value, a reference only.<\/p>\n      <p>In the MESA runs the crystallization front sits at <b>\u0393 \u2248 205 to 219<\/b> (Table 9-1), because the C/O mixture melts at higher \u0393.<\/p>\n      <p class=\"box\">At every luminosity the \u0393 = 175 crossing (open circle) lies farther out in mass than the real front (filled circle): the reference surface runs ahead of the front.<\/p>\n    <\/div>\n  <\/div>\n  <footer class=\"key\"><span>Curve shapes and luminosity steps are schematic; the reference value and front band are from the thesis.<\/span><span>Sources: Table 9-1, Fig 7-3.<\/span><\/footer>\n<\/section>\n<div class=\"controls\">\n  <span style=\"font-size:14px;color:var(--muted)\">Show curves:<\/span>\n  <button id=\"b1\" type=\"button\" aria-pressed=\"true\">1<\/button><button id=\"b2\" type=\"button\" aria-pressed=\"true\">2<\/button><button id=\"b3\" type=\"button\" aria-pressed=\"true\">3<\/button><button id=\"b4\" type=\"button\" aria-pressed=\"true\">4<\/button>\n  <button id=\"theme\" type=\"button\">Dark<\/button>\n<\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 5. Profiles are schematic shapes, with central values chosen so the fronts spread across the core. To plot real profiles, send the \u0393 versus mass data behind Fig 7-3 and this page will use them instead.<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst P = new URLSearchParams(location.search);\nif (P.has('still')) document.body.classList.add('still');\nconst MSTAR = 0.6113, G_REF = 175, F_LO = 205, F_HI = 219, F_MID = 212;\n// schematic density profile rho ~ (1 - r^2)^1.5 (same as Visual 1); mass fraction table\nconst RT = (() => { const n = 400, m = [0]; let s = 0;\n  for (let i = 1; i <= n; i++) { const r = (i - .5) / n; s += Math.pow(1 - r * r, 1.5) * r * r; m.push(s); } return m.map(v => v / s); })();\nconst rOfQ = q => { if (q <= 0) return 0; if (q >= 1) return 1; let i = 1; while (RT[i] < q) i++; return (i - 1 + (q - RT[i - 1]) / (RT[i] - RT[i - 1])) / 400; };\nconst shape = q => (1 - 0.75 * Math.pow(q, 1.6)) * (1 - Math.pow(q, 40));  // schematic \u0393 profile relative to center, steep drop in the outer layers\nconst GC = [221, 268, 368, 579];                             // schematic central \u0393, brighter to dimmer\nconst LBL = ['brighter', '', '', 'dimmer'];\nconst on = [true, true, true, true];\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nlet C = {};\nfunction readColors() { ['--ink','--muted','--rule','--band','--ref','--c1','--c2','--c3','--c4','--stage','--bg','--oxy'].forEach(k => C[k.slice(2)] = css(k));\n  const th = document.documentElement.dataset.theme; C.dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches); }\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction label(x, s, px, py, o = {}) { x.save(); x.font = `${o.bold ? 700 : 400} ${o.size || 14}px ${o.mono ? 'IBM Plex Mono' : 'Atkinson Hyperlegible'}, sans-serif`;\n  x.textAlign = o.align || 'left'; x.textBaseline = o.base || 'middle';\n  if (o.halo !== false) { x.lineWidth = 4; x.strokeStyle = C.stage; x.lineJoin = 'round'; x.strokeText(s, px, py); }\n  x.fillStyle = o.col || C.ink; x.fillText(s, px, py); x.restore(); }\nfunction crossing(gc, g) { // mass fraction where \u0393 falls to g\n  let lo = 0, hi = 0.999; if (gc * shape(0) < g) return null; for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; (gc * shape(m) > g) ? lo = m : hi = m; } return lo; }\nfunction draw() {\n  if (!C.ink) return;\n  const [x, w, h] = fit(document.getElementById('plot')); x.clearRect(0, 0, w, h);\n  const L0 = 64, R0 = w - 16, T0 = 12, B0 = h - 42, gmin = 70, gmax = 800;\n  const X = q => L0 + (R0 - L0) * q, Y = g => B0 - (B0 - T0) * Math.log(g / gmin) / Math.log(gmax / gmin);\n  x.strokeStyle = C.muted; x.lineWidth = 1.5; x.beginPath(); x.moveTo(L0, T0); x.lineTo(L0, B0); x.lineTo(R0, B0); x.stroke();\n  [100, 300, 500, 800].forEach(g => { x.strokeStyle = C.rule; x.lineWidth = 1; x.beginPath(); x.moveTo(L0, Y(g)); x.lineTo(R0, Y(g)); x.stroke();\n    label(x, String(g), L0 - 8, Y(g), { align: 'right', size: 12, mono: true, col: C.muted, halo: false }); });\n  for (let k = 0; k <= 5; k++) { const q = k / 5; label(x, (q * MSTAR).toFixed(2), X(q), B0 + 14, { align: 'center', size: 12, mono: true, col: C.muted, halo: false }); }\n  label(x, 'mass coordinate from the center (M\u2609)   center \u2190   \u2192 surface', R0, B0 + 32, { align: 'right', size: 13, col: C.muted, halo: false });\n  x.save(); x.translate(16, (T0 + B0) / 2); x.rotate(-Math.PI / 2); label(x, '\u0393 (log scale)', 0, 0, { align: 'center', size: 13, col: C.muted, halo: false }); x.restore();\n  // front band and reference line\n  x.fillStyle = C.band; x.globalAlpha = .16; x.fillRect(L0, Y(F_HI), R0 - L0, Y(F_LO) - Y(F_HI)); x.globalAlpha = 1;\n  label(x, 'crystallization front in MESA: \u0393 \u2248 205 to 219', R0 - 6, Y(F_HI) - 11, { align: 'right', size: 13, bold: true, col: C.band });\n  x.strokeStyle = C.ref; x.lineWidth = 2; x.setLineDash([8, 5]); x.beginPath(); x.moveTo(L0, Y(G_REF)); x.lineTo(R0, Y(G_REF)); x.stroke(); x.setLineDash([]);\n  label(x, '\u0393 = 175: classical reference only', R0 - 6, Y(G_REF) + 13, { align: 'right', size: 13, bold: true, col: C.ref });\n  label(x, '175', L0 - 8, Y(G_REF), { align: 'right', size: 12, mono: true, bold: true, col: C.ref, halo: false });\n  const cols = [C.c1, C.c2, C.c3, C.c4];\n  GC.forEach((gc, i) => { if (!on[i]) return;\n    x.strokeStyle = cols[i]; x.lineWidth = 3; x.beginPath();\n    for (let k = 0; k <= 300; k++) { const q = k / 300 * 0.995, g = Math.max(gmin, gc * shape(q)); k ? x.lineTo(X(q), Y(g)) : x.moveTo(X(q), Y(g)); } x.stroke();\n    const qf = crossing(gc, F_MID), qr = crossing(gc, G_REF);\n    if (qf != null && qr != null) {\n      x.strokeStyle = C.ref; x.lineWidth = 2; x.beginPath(); x.moveTo(X(qf), Y(F_MID)); x.lineTo(X(qr), Y(G_REF)); x.stroke();\n      x.fillStyle = cols[i]; x.strokeStyle = C.ink; x.lineWidth = 1.5; x.beginPath(); x.arc(X(qf), Y(F_MID), 6, 0, 7); x.fill(); x.stroke();\n      x.fillStyle = C.stage; x.strokeStyle = C.ref; x.lineWidth = 2.5; x.beginPath(); x.arc(X(qr), Y(G_REF), 6, 0, 7); x.fill(); x.stroke();\n    }\n    label(x, String(i + 1) + (LBL[i] ? ' (' + LBL[i] + ')' : ''), X(0.015), Y(gc * shape(0.015)) - 12, { size: 13, bold: true, col: C.dark ? C.ink : cols[Math.max(i, 1)] });\n  });\n}\nconst themeBtn = document.getElementById('theme');\nfunction syncTheme() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; draw(); }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; };\n[1, 2, 3, 4].forEach(k => { const b = document.getElementById('b' + k); b.onclick = () => { on[k - 1] = !on[k - 1]; b.setAttribute('aria-pressed', on[k - 1]); draw(); }; });\nnew MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);\nnew ResizeObserver(draw).observe(document.getElementById('stage'));\nif (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');\nsyncTheme(); document.fonts && document.fonts.ready.then(draw);\n})();\n<\/script>\n<\/body><\/html>", "opener": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>html,body{margin:0}<\/style><\/head><body><title>Thesis Opener<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap\">\n<style>\n/* Layout: 16:9 title slide. Left: night sky panel with a cooling white dwarf, quarter cut away to show the crystal core. Right: thesis title block. Same tokens as Visuals 1 to 5. */\n:root{\n  --bg:#f6f7f9; --stage:#ffffff; --ink:#14181f; --muted:#556070; --rule:#d5dae2; --sky:#0b1220; --skyink:#dfe6f2;\n  --oxy:#1f5fc4; --carb:#e27a14;\n  --f-body:\"Atkinson Hyperlegible\",system-ui,sans-serif; --f-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440; --sky:#070b14; --skyink:#dfe6f2; --oxy:#5b97f0; --carb:#f39a3d; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1318; --stage:#161b22; --ink:#eef2f7; --muted:#9aa6b6; --rule:#2c3440; --sky:#070b14; --skyink:#dfe6f2; --oxy:#5b97f0; --carb:#f39a3d; color-scheme:dark}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}\n#stage{background:var(--stage);border:1px solid var(--rule);border-radius:6px;overflow:hidden;\n  display:grid;grid-template-columns:1fr 1fr;aspect-ratio:16/9;min-height:0}\n.sky{background:var(--sky);position:relative;min-height:0}\ncanvas{display:block;width:100%;height:100%}\n.title{padding:clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.6vw,22px);min-width:0}\n.kicker{font-size:clamp(12px,1.05vw,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\nh1{font-size:clamp(22px,2.9vw,42px);line-height:1.15;margin:0;text-wrap:balance}\n.who{font-size:clamp(14px,1.4vw,20px);margin:0}\n.who span{color:var(--muted)}\n.rule{height:4px;width:120px;background:linear-gradient(90deg,var(--oxy),var(--carb));border-radius:2px}\n.controls{background:var(--stage);border:1px solid var(--rule);border-radius:6px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.controls button{font:inherit;font-size:15px;padding:6px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--stage);color:var(--ink);cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}\n.foot{font-size:13px;color:var(--muted);max-width:75ch}\n@media (max-width:900px){#stage{grid-template-columns:1fr;aspect-ratio:auto}.sky{height:min(90vw,420px)}}\nbody.still .controls,body.still .foot{display:none}\n<\/style>\n\n<div class=\"wrap\">\n<section id=\"stage\" aria-label=\"Title slide\">\n  <div class=\"sky\"><canvas id=\"wd\" role=\"img\" aria-label=\"A white dwarf dimming over billions of years while a crystal core grows inside it\"><\/canvas><\/div>\n  <div class=\"title\">\n    <p class=\"kicker\">MS thesis defense \u00b7 Louisiana Tech<\/p>\n    <h1>Numerical and Thermodynamic Consistency in the Calculation of White Dwarf Crystallization Energetics<\/h1>\n    <div class=\"rule\"><\/div>\n    <p class=\"who\">Steven Anderson<br><span>Advisor: Dr. John Shaw<\/span><\/p>\n    <p class=\"who\"><span id=\"dateTxt\">December 2026<\/span><\/p>\n  <\/div>\n<\/section>\n<div class=\"controls\">\n  <button id=\"play\" type=\"button\">Pause<\/button>\n  <button id=\"theme\" type=\"button\">Dark<\/button>\n<\/div>\n<p class=\"foot\">Draft for the thesis defense, Visual 6. Schematic: the glow fades and reddens as the star cools, and the cut away quarter shows the crystal core (oxygen rich center, blue) growing from about 1.9 Gyr. Brightness and colors are not to scale.<\/p>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst P = new URLSearchParams(location.search);\nconst STILL = P.has('still'); if (STILL) document.body.classList.add('still');\nconst T0 = 0.5, T1 = 9, TC = 1.9, TE = 8.5, QMAX = 0.58 / 0.6113;\nlet t = P.has('t') ? +P.get('t') : 1.0, playing = !STILL;\nconst g = u => 1 - Math.pow(1 - u, 1.8);\nconst qFront = a => a <= TC ? 0 : QMAX * g(Math.min(1, (a - TC) / (TE - TC)));\nconst RT = (() => { const n = 400, m = [0]; let s = 0;\n  for (let i = 1; i <= n; i++) { const r = (i - .5) / n; s += Math.pow(1 - r * r, 1.5) * r * r; m.push(s); } return m.map(v => v / s); })();\nconst rOfQ = q => { if (q <= 0) return 0; if (q >= 1) return 1; let i = 1; while (RT[i] < q) i++; return (i - 1 + (q - RT[i - 1]) / (RT[i] - RT[i - 1])) / 400; };\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };\nlet C = {};\nfunction readColors() { ['--sky','--skyink','--oxy','--carb'].forEach(k => C[k.slice(2)] = css(k)); C.O = hex('#3f7fe0'); C.Cc = hex('#e8892b');\n  const th = document.documentElement.dataset.theme; C.dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches); }\nconst stars = (() => { let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; return Array.from({ length: 140 }, () => [r(), r(), r()]); })();\n// schematic surface color: hot bluish white to cool orange red, and brightness falling\nfunction surf(a) { const u = Math.min(1, Math.max(0, (Math.log(a) - Math.log(T0)) / (Math.log(T1) - Math.log(T0))));\n  const hot = [214, 228, 255], warm = [255, 236, 200], cool = [255, 150, 90];\n  const c = u < .5 ? hot.map((v, i) => v + (warm[i] - v) * u * 2) : warm.map((v, i) => v + (cool[i] - v) * (u - .5) * 2);\n  return { c, b: 1 - 0.78 * u }; }\nfunction XO(q) { const xl = 0.672 - 0.12 * Math.pow(q / QMAX, 1.2); return xl + 0.113 * (xl - 0.45) / 0.222; }\nfunction oc(x, light) { const tt = Math.min(1, Math.max(0, (x - 0.52) / 0.28)); return `rgb(${C.Cc.map((v, i) => Math.round((v + (C.O[i] - v) * tt) * (1 - light) + 255 * light)).join(',')})`; }\nfunction fit(cv) { const d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return [x, w, h]; }\nfunction draw() {\n  const [x, w, h] = fit(document.getElementById('wd'));\n  x.fillStyle = C.sky; x.fillRect(0, 0, w, h);\n  for (const [a, b, c] of stars) { x.fillStyle = `rgba(255,255,255,${.15 + .5 * c})`; x.fillRect(a * w, b * h, c > .9 ? 2 : 1.2, c > .9 ? 2 : 1.2); }\n  const cx = w / 2, cy = h * .47, R = Math.min(w, h) * .26, s = surf(t);\n  // glow\n  const gl = x.createRadialGradient(cx, cy, R * .9, cx, cy, R * (1.6 + 1.6 * s.b));\n  gl.addColorStop(0, `rgba(${s.c.map(Math.round).join(',')},${.55 * s.b})`); gl.addColorStop(1, `rgba(${s.c.map(Math.round).join(',')},0)`);\n  x.fillStyle = gl; x.beginPath(); x.arc(cx, cy, R * 3.4, 0, 7); x.fill();\n  // disk\n  const dk = x.createRadialGradient(cx - R * .25, cy - R * .25, R * .1, cx, cy, R);\n  const lum = c => c.map(v => Math.round(v * (.5 + .5 * s.b)));\n  dk.addColorStop(0, `rgb(${lum(s.c.map(v => Math.min(255, v + 20))).join(',')})`); dk.addColorStop(1, `rgb(${lum(s.c.map(v => v * .8)).join(',')})`);\n  x.fillStyle = dk; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();\n  // cut away quarter (upper right): liquid C/O interior, crystal core\n  const Rc = R * .955, qF = qFront(t), rF = rOfQ(qF) * Rc;\n  x.save(); x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, -Math.PI / 2, 0); x.closePath(); x.clip();\n  x.fillStyle = '#c7ccd4'; x.fillRect(cx, cy - R, R, R);\n  x.fillStyle = oc(0.57, .6); x.beginPath(); x.arc(cx, cy, Rc, 0, 7); x.fill();\n  for (let i = 80; i >= 1 && qF > 0; i--) { const q = qF * i / 80; x.fillStyle = oc(XO(q), .05); x.beginPath(); x.arc(cx, cy, rOfQ(q) * Rc, 0, 7); x.fill(); }\n  if (qF > 0) { x.fillStyle = 'rgba(255,255,255,.35)'; for (let yy = cy - rF; yy < cy; yy += 6) for (let xx = cx + ((Math.round((yy - cy) / 6) & 1) ? 3 : 0); xx < cx + rF; xx += 6) x.fillRect(xx, yy, 1.3, 1.3);\n    x.strokeStyle = '#14181f'; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, rF, 0, 7); x.stroke(); }\n  x.restore();\n  x.font = `700 ${Math.max(11, R / 11)}px \"Atkinson Hyperlegible\", sans-serif`; x.textAlign = 'left'; x.textBaseline = 'middle';\n  x.fillStyle = '#14181f'; { const rm = (Math.max(rF, R * .1) + Rc) / 2 * .707; x.textAlign = 'center'; x.fillText('liquid', cx + rm, cy - rm); x.textAlign = 'left'; }\n  if (qF > .05) { x.fillStyle = '#ffffff'; x.fillText('crystal', cx + 6, cy - rF * .55); }\n  x.strokeStyle = 'rgba(20,24,31,.6)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(cx, cy - R); x.lineTo(cx, cy); x.lineTo(cx + R, cy); x.stroke();\n  // captions\n  x.font = `700 ${Math.max(13, w / 34)}px \"IBM Plex Mono\", monospace`; x.fillStyle = C.skyink; x.textAlign = 'left'; x.textBaseline = 'alphabetic';\n  x.fillText(`${t.toFixed(1)} Gyr`, 18, h - 46);\n  x.font = `400 ${Math.max(12, w / 44)}px \"Atkinson Hyperlegible\", sans-serif`; x.fillStyle = 'rgba(223,230,242,.8)';\n  x.fillText(qF > 0 ? 'cooling, dimming, freezing from the center' : 'cooling and dimming: no fusion, only stored heat', 18, h - 22);\n  x.textAlign = 'right'; x.fillText('schematic', w - 18, h - 22);\n}\nconst playBtn = document.getElementById('play');\nplayBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };\nconst themeBtn = document.getElementById('theme');\nfunction syncTheme() { readColors(); themeBtn.textContent = C.dark ? 'Light' : 'Dark'; }\nthemeBtn.onclick = () => { document.documentElement.dataset.theme = C.dark ? 'light' : 'dark'; };\nnew MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);\nif (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');\nif (matchMedia('(prefers-reduced-motion: reduce)').matches && !P.has('t')) { playing = false; t = 6; playBtn.textContent = 'Play'; }\nsyncTheme();\nlet last = performance.now();\nfunction frame(now) { const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;\n  if (playing) { t += dt * 0.6; if (t > T1) t = T0; }\n  draw(); requestAnimationFrame(frame); }\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body><\/html>"};
const KEYS = ["front", "cliff", "gap", "runs", "gamma", "opener"];
const host = document.getElementById('host'), frames = {};
function size(f) { try { const d = f.contentDocument; if (d && d.body) f.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px'; } catch (e) { f.style.height = '100vh'; } }
function syncTheme(f) { try { const t = document.documentElement.dataset.theme; const r = f.contentDocument.documentElement; if (t) r.dataset.theme = t; } catch (e) {} }
function show(k) {
  if (!DOCS[k]) k = KEYS[0];
  if (!frames[k]) { const f = document.createElement('iframe'); f.title = k; f.srcdoc = DOCS[k];
    f.addEventListener('load', () => { syncTheme(f); size(f); try { new ResizeObserver(() => size(f)).observe(f.contentDocument.body); } catch (e) {} });
    frames[k] = f; host.appendChild(f); }
  for (const [kk, f] of Object.entries(frames)) f.hidden = kk !== k;
  size(frames[k]);
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
}
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { if (location.hash !== '#' + b.dataset.k) location.hash = b.dataset.k; else show(b.dataset.k); }));
addEventListener('hashchange', () => show(location.hash.slice(1)));
new MutationObserver(() => Object.values(frames).forEach(syncTheme)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
show(location.hash.slice(1) || KEYS[0]);
})();
