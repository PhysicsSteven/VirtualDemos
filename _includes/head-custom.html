<!-- Loaded by the GitHub Pages theme on the Markdown pages (student handouts) so their LaTeX renders. kramdown turns $$...$$ into \( \) and \[ \]; single $...$ is handled here too. -->
<!-- Interactive worksheets: answer boxes, editable data tables, saving and export on the student worksheets it lists (curriculum/labs/worksheet.js). Before MathJax, so it reads the page before any math is typeset. -->
<script defer src="{{ '/curriculum/labs/worksheet.js' | relative_url }}"></script>
<!-- Printing: black on white, no buttons, the demo link spelled out (curriculum/labs/print.css). -->
<link rel="stylesheet" href="{{ '/curriculum/labs/print.css' | relative_url }}" media="print">
<!-- Symbol hover: what each symbol in an equation stands for on this handout (curriculum/labs/symbols.js, meanings from tools/symbols.py). -->
<script defer src="{{ '/curriculum/labs/symbols.js' | relative_url }}"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
<!-- MathJax does not line break; on a narrow phone a wide display scrolls sideways inside its own box instead of widening the page. -->
<style>mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }</style>
