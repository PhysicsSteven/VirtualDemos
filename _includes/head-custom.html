<!-- Loaded by the GitHub Pages theme on the Markdown pages (student handouts) so their LaTeX renders. kramdown turns $$...$$ into \( \) and \[ \]; single $...$ is handled here too. -->
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
