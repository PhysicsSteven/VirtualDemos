<!-- Site theme switch (demos/lib/theme.js): Light, Dark or Browser default, the same choice as on the demos. The Primer theme is light only, so the dark look is set here with --hd- colors, on screen only: printed handouts and worksheets stay as they are. worksheet.js uses the same colors. -->

<style>

}
@media screen {

  body { color: var(--hd-ink, #24292e); background-color: var(--hd-bg, #fff); }
  a { color: var(--hd-link, #0366d6); }
  .markdown-body h1, .markdown-body h2 { border-bottom-color: var(--hd-line, #eaecef); }
  .markdown-body h6, .markdown-body blockquote { color: var(--hd-muted, #6a737d); }
  .markdown-body blockquote { border-left-color: var(--hd-line2, #dfe2e5); }
  .markdown-body hr { background-color: var(--hd-line, #e1e4e8); }
  .markdown-body table th, .markdown-body table td { border-color: var(--hd-line2, #dfe2e5); }
  .markdown-body table tr { background-color: var(--hd-bg, #fff); border-top-color: var(--hd-line2, #c6cbd1); }
  .markdown-body table tr:nth-child(2n) { background-color: var(--hd-row, #f6f8fa); }
  .markdown-body code, .markdown-body tt { background-color: var(--hd-code, rgba(27, 31, 35, 0.05)); }
  .markdown-body pre, .markdown-body .highlight pre { background-color: var(--hd-surface, #f6f8fa); }
  .markdown-body kbd { color: var(--hd-ink, #444d56); background-color: var(--hd-surface, #fafbfc); border-color: var(--hd-line2, #c6cbd1); }
  .ws-plot svg rect[fill="#fff"] { fill: var(--hd-field, #fff); stroke: var(--hd-line2, #8c959f); }
  .ws-plot svg line[stroke="#eaeef2"] { stroke: var(--hd-grid, #eaeef2); }
  .ws-plot svg text[fill="#57606a"] { fill: var(--hd-muted, #57606a); }
  .ws-plot svg text[fill="#1f2328"] { fill: var(--hd-ink, #1f2328); }
  .ws-plot svg line[stroke="#1f6feb"], .ws-plot svg polyline[stroke="#1f6feb"] { stroke: var(--hd-accent, #1f6feb); }
  .ws-plot svg circle[fill="#cf222e"] { fill: var(--hd-dot, #cf222e); } .ws-plot svg circle[fill="#cf222e"][stroke] { stroke: var(--hd-field, #fff); }
